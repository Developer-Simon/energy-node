name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Test and create draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: dashboard/go.mod

      - name: Test dashboard
        working-directory: dashboard
        run: |
          go vet ./...
          go test ./...

      - name: Assemble release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/notes.md"
          if scripts/release/extract-changelog.sh dashboard/CHANGELOG.md "$TAG" > "$notes_file"; then
            {
              echo "notes-file=$notes_file"
              echo "generate=false"
            } >> "$GITHUB_OUTPUT"
          else
            echo "No CHANGELOG section for $TAG; using generated notes." >&2
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES_FILE: ${{ steps.notes.outputs.notes-file }}
          GENERATE: ${{ steps.notes.outputs.generate }}
        run: |
          set -euo pipefail
          # A draft until publish below: nodes must not see a release whose
          # bundles are not attached yet.
          args=(release create "$TAG" --title "$TAG" --verify-tag --draft)
          case "$TAG" in
            *-*) args+=(--prerelease) ;;
          esac
          if [ "$GENERATE" = "true" ]; then
            args+=(--generate-notes)
          else
            args+=(--notes-file "$NOTES_FILE")
          fi
          gh "${args[@]}"

  bundles:
    name: Signed bundles
    needs: release
    uses: ./.github/workflows/bundle-release.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  installer:
    name: Installer
    needs: release
    uses: ./.github/workflows/installer-release.yml
    with:
      tag: ${{ github.ref_name }}

  publish:
    name: Publish release
    needs: [bundles, installer]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
