name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Test and create draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: dashboard/go.mod

      - name: Test dashboard
        working-directory: dashboard
        run: |
          go vet ./...
          go test ./...

      - name: Assemble release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/notes.md"
          section_file="$RUNNER_TEMP/section.md"
          # The previous final release, the highlights cover everything since.
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "${TAG}^" 2>/dev/null || true)"
          python3 scripts/release/release_highlights.py --repo . --previous-tag "$previous" > "$notes_file"
          if scripts/release/extract-changelog.sh dashboard/CHANGELOG.md "$TAG" > "$section_file"; then
            if [ -s "$notes_file" ]; then printf '\n## Dashboard changes\n\n' >> "$notes_file"; fi
            cat "$section_file" >> "$notes_file"
            generate=false
          else
            echo "No CHANGELOG section for $TAG; generated notes follow the highlights." >&2
            generate=true
          fi
          {
            echo "notes-file=$notes_file"
            echo "generate=$generate"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES_FILE: ${{ steps.notes.outputs.notes-file }}
          GENERATE: ${{ steps.notes.outputs.generate }}
        run: |
          set -euo pipefail
          # A draft until publish below: nodes must not see a release whose
          # bundles are not attached yet.
          args=(release create "$TAG" --title "$TAG" --verify-tag --draft)
          case "$TAG" in
            *-*) args+=(--prerelease) ;;
          esac
          # gh puts the notes file above the generated notes when both are given.
          if [ "$GENERATE" = "true" ]; then
            args+=(--generate-notes)
          fi
          if [ -s "$NOTES_FILE" ]; then
            args+=(--notes-file "$NOTES_FILE")
          fi
          gh "${args[@]}"

  bundles:
    name: Signed bundles
    needs: release
    uses: ./.github/workflows/bundle-release.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  installer:
    name: Installer
    needs: release
    uses: ./.github/workflows/installer-release.yml
    with:
      tag: ${{ github.ref_name }}

  publish:
    name: Publish release
    needs: [bundles, installer]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
