name: Sync prerelease

# Merges main into the prerelease branch and sets the prerelease versions
# (scripts/version/sync_prerelease.py). Runs on demand and when a PR into
# prerelease is opened, not on every push to main, so a burst of hotfixes causes
# one merge. A code conflict, or a web asset changed on both lines, aborts the
# merge: the run opens (or comments on) an issue with the paths and ends red.
# Resolve it locally with the commands in the issue.

on:
  workflow_dispatch:
  # Only opened: pushes to an open PR must not start another sync. GitHub reads
  # this trigger from the prerelease copy of this file.
  pull_request:
    types: [opened]
    branches: [prerelease]

permissions:
  contents: write
  issues: write

# Runs queue up instead of cancelling each other: a cancelled sync could leave a
# push half done.
concurrency:
  group: sync-prerelease
  cancel-in-progress: false

jobs:
  sync:
    name: Merge main into prerelease
    runs-on: ubuntu-latest
    # A fork PR gets no secrets, and BUMP_TOKEN is needed for the push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BUMP_TOKEN }}
          fetch-depth: 0

      - name: Sync prerelease with main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git rev-parse --verify --quiet origin/prerelease >/dev/null; then
            echo "::notice::origin/prerelease does not exist - nothing to sync."
            exit 0
          fi

          git config user.name "energy-node-bot"
          git config user.email "energy-node-bot@users.noreply.github.com"
          git checkout prerelease

          out_file="$RUNNER_TEMP/sync-prerelease-out.txt"
          set +e
          python3 scripts/version/sync_prerelease.py --push > "$out_file"
          rc=$?
          set -e
          cat "$out_file"

          label="prerelease-sync"
          case "$rc" in
            0)
              # Synced: close the open conflict issues, if any.
              gh issue list --repo "$GITHUB_REPOSITORY" --label "$label" --state open \
                --json number --jq '.[].number' > "$RUNNER_TEMP/open-issues.txt"
              while read -r number; do
                [ -n "$number" ] || continue
                gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
                  --comment "Prerelease is synced with main again."
              done < "$RUNNER_TEMP/open-issues.txt"
              exit 0
              ;;
            3)
              # Conflict: the merge was aborted. The printed CONFLICT and ASSET
              # lines go into a file and are read as data, never as shell source.
              body="$RUNNER_TEMP/conflict-body.md"
              {
                echo "The merge of main into prerelease stopped on conflicts in these paths:"
                echo
                sed -n 's/^CONFLICT /- `/p' "$out_file" | sed 's/$/`/'
                if grep -q '^ASSET ' "$out_file"; then
                  echo
                  echo "Both lines changed these web assets, each needs a new ?v= above both:"
                  echo
                  sed -n 's/^ASSET /- `/p' "$out_file" | sed 's/$/`/'
                fi
                echo
                echo "Resolve it locally, stage the files and finish the merge:"
                echo
                echo '```'
                echo "git switch prerelease && git pull --ff-only"
                echo "python3 scripts/version/sync_prerelease.py --keep"
                echo "# resolve, bump the ?v= of every asset, git add"
                echo "python3 scripts/version/sync_prerelease.py --continue --push"
                echo '```'
                echo
                echo "Details: docs/developing/releasing.md, section \"Updating prerelease from main\"."
                echo
                echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              } > "$body"

              gh label create "$label" --repo "$GITHUB_REPOSITORY" --force \
                --description "Prerelease sync needs manual conflict resolution" >/dev/null

              open_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$label" \
                --state open --json number --jq '.[0].number // empty')"
              if [ -n "$open_number" ]; then
                gh issue comment "$open_number" --repo "$GITHUB_REPOSITORY" --body-file "$body"
              else
                gh issue create --repo "$GITHUB_REPOSITORY" --label "$label" \
                  --title "Prerelease sync needs manual conflict resolution" \
                  --body-file "$body"
              fi
              echo "::error::Merging main into prerelease stopped on conflicts."
              exit 1
              ;;
            *)
              echo "::error::sync_prerelease.py failed with exit code $rc."
              exit 1
              ;;
          esac
