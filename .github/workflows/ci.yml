name: CI

on:
  # `push` is the post-merge run on `main`. A PR branch is never run by its own
  # pushes: the Version bump workflow dispatches CI once the branch has settled
  # (bump and changelog commits in place), with the PR number as input. So CI
  # runs exactly once per settled head and never on the pre-bump state.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: "Number of the pull request whose head branch this run checks"
        required: true
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which of the jobs below need to run for this change. On a PR run
  # (workflow_dispatch) it diffs the head against the PR base; on the
  # post-merge `main` run (or if the diff can't be computed) every area is
  # marked changed so nothing is skipped.
  # A change to the workflow file itself also forces every job to run.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      dashboard: ${{ steps.filter.outputs.dashboard }}
      python: ${{ steps.filter.outputs.python }}
      shell: ${{ steps.filter.outputs.shell }}
      vendored: ${{ steps.filter.outputs.vendored }}
      ha: ${{ steps.filter.outputs.ha }}
      installer: ${{ steps.filter.outputs.installer }}
      installer_webui: ${{ steps.filter.outputs.installer_webui }}
      docs_scripts: ${{ steps.filter.outputs.docs_scripts }}
    steps:
      # Runs from workflow_dispatch are not linked to the PR, so their checks
      # do not show there. The commit status "CI" is what the PR shows and what
      # branch protection requires: pending with a link to this run now, the
      # result from the "CI ok" job at the end.
      - name: Mark the commit status CI as running
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context=CI -f description="Running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            base_ref="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName || true)"
            # Three-dot: only what this branch changed since it diverged from
            # the base, ignoring commits that landed on the base since then.
            files=""
            if [ -n "$base_ref" ] && git fetch origin "$base_ref" --quiet; then
              files="$(git diff --name-only "origin/$base_ref...$GITHUB_SHA" || true)"
            fi
          else
            files=""
          fi
          echo "Changed files:"
          printf '%s\n' "$files"

          all() { for o in dashboard installer_webui installer python shell vendored ha docs_scripts; do echo "$o=true"; done >> "$GITHUB_OUTPUT"; }

          # No diff (post-merge run, or it could not be computed) or a change to
          # a workflow: run everything. This check runs against the unfiltered
          # diff so a docs-only PR does not land here. pages.yml only deploys
          # the documentation site and is exempt.
          wf="$(grep -E '^\.github/workflows/' <<<"$files" | grep -vE '/pages\.yml$' || true)"
          if [ -z "$files" ] || [ -n "$wf" ]; then
            all
            exit 0
          fi

          # Documentation-only changes affect no job. Drop Markdown paths
          # (this covers every CHANGELOG.md) and the VERSION files the Version
          # bump workflow rewrites before matching: a PR that only touches those
          # has a non-empty diff but nothing left here, so every emit below
          # marks its area false and all jobs skip. The docs site tooling under
          # scripts/docs/ is split off and only runs its own small job.
          files="$(printf '%s\n' "$files" | grep -vE '\.md$|(^|/)VERSION$' || true)"
          echo "Changed files (excluding Markdown and VERSION):"
          printf '%s\n' "$files"

          emit() { if grep -qE "$2" <<<"$files"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          emit docs_scripts '^scripts/docs/|^docs/_data/nav\.yml$|^scripts/tests/test_docs_pages\.sh$'
          files="$(printf '%s\n' "$files" | grep -vE '^scripts/docs/' || true)"
          # installer/webui too: the dashboard module depends on it through a
          # replace directive (its local Re-Deploy screen implements
          # hostapi.Backend), so a change there can break the dashboard build
          # without touching a single file under dashboard/.
          emit dashboard '^dashboard/|^installer/webui/|^services/[^/]+/[^/]+\.schema\.json$'
          emit installer_webui '^installer/webui/'
          emit installer  '^installer/|^scripts/bootstrap/'
          emit python    '^(services|libs)/|^scripts/tests/|^scripts/version/|^scripts/generate_changelog\.sh$|^scripts/build/(make_changelog_json|highlight_i18n|highlight_translations|highlight_details)\.py$|^scripts/release/release_highlights\.py$|^requirements-dev\.txt$'
          emit shell     '^scripts/|^dashboard/energy-node-dashboard-system-action(\.sudoers)?$'
          emit vendored  '^dashboard/|^libs/battery_soc_core/|^integrations/homeassistant/|^services/battery_soc/battery_soc_devices\.schema\.json$|^docs/(images/device-icons/|images/ha/icons/|ha/icons-catalogue\.md$)|^scripts/(vendor_(core|card)|render_ha_descriptions|icons/flatten_icons)\.py$|^dashboard/internal/schemaloc/catalogs/'
          emit ha        '^integrations/homeassistant/|^libs/battery_soc_core/|^dashboard/internal/schemaloc/catalogs/'

  dashboard-go:
    name: Dashboard (Go)
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: dashboard/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  installer-go:
    name: Installer (Go)
    needs: changes
    if: needs.changes.outputs.installer == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # Task 5 braucht einen echten sshd fuer den Transport-Integrationstest;
      # ubuntu-latest bringt keinen mit.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server openssh-client
      - name: Assert WebKitGTK is absent (Komponente F, Stufe 1's real failure path)
        run: |
          if ldconfig -p | grep -qiE 'webkitgtk|webkit2gtk'; then
            echo "::error::WebKitGTK is installed on this runner - internal/shell's no-WebKitGTK fallback test no longer proves what it claims. See ci.yml and the spec's Komponente F Test row." >&2
            exit 1
          fi
      - run: go test ./...

  dashboard-js:
    name: Dashboard (JS)
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  installer-webui-go:
    name: Installer webui (Go)
    needs: changes
    if: needs.changes.outputs.installer_webui == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer/webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  installer-webui-js:
    name: Installer webui (JS)
    needs: changes
    if: needs.changes.outputs.installer_webui == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer/webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  installer-webui-e2e:
    name: Installer webui (browser)
    needs: changes
    if: needs.changes.outputs.installer_webui == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer/webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  installer-cross:
    name: Installer (cross-compile)
    needs: changes
    if: needs.changes.outputs.installer == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [windows/amd64, darwin/amd64, darwin/arm64, linux/amd64]
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
      - name: Build for ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          CGO_ENABLED: '0'
        run: GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}" go build -o "$RUNNER_TEMP/installer-build" ./cmd/installer

  python-bridges:
    name: Python bridges
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e libs/energy_node_common -e libs/battery_soc_core pytest
          pip install -r requirements-dev.txt
      - run: pytest services libs scripts/tests -q

  shell-scripts:
    name: Shell scripts
    needs: changes
    if: needs.changes.outputs.shell == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Full history: test_publish_mirror.sh builds a changelog from git log.
      # In a shallow clone whose only commit is the bot's changelog commit
      # (the head a dispatched PR run checks) it finds no entry at all.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/tests/test_publish_mirror.sh
      - run: bash scripts/tests/test_generate_changelog.sh
      - run: bash scripts/tests/test_generate_changelog_cap.sh
      - run: bash scripts/tests/test_generate_changelog_foreign_tag.sh
      - run: bash scripts/tests/test_extract_changelog.sh
      - run: bash scripts/tests/test_bump_version.sh
      - run: bash scripts/tests/test_pr_message.sh
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -x scripts/bootstrap/*.sh scripts/bootstrap/lib/*.sh \
                        scripts/build/*.sh scripts/build/lib/*.sh \
                        scripts/tests/test_bootstrap_*.sh scripts/tests/test_build_*.sh \
                        scripts/tests/lib/*.sh \
                        scripts/tests/bootstrap_container.sh dashboard/energy-node-updater.sh \
                        scripts/tests/test_updater.sh scripts/tests/test_updater_end_to_end.sh
      # Every bootstrap/build test by glob: a new scripts/tests/test_bootstrap_*.sh
      # or test_build_*.sh is picked up without touching this workflow (a workflow
      # edit makes the change-detection job run every area, see `changes`).
      # All of them run; the step fails if any did.
      - name: Bootstrap and build tests
        run: |
          rc=0
          for t in scripts/tests/test_bootstrap_*.sh scripts/tests/test_build_*.sh; do
            echo "::group::$t"
            bash "$t" || { echo "::error::$t failed"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc
      - run: bash scripts/tests/test_updater.sh
      - run: bash scripts/tests/test_updater_end_to_end.sh
      - run: ./scripts/dev/check_tracked_secrets.sh

  vendored-artefacts:
    name: Vendored artefacts in sync
    needs: changes
    if: needs.changes.outputs.vendored == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Both scripts are stdlib-only and regenerate a checked-in copy;
      # --check exits non-zero when the copy has drifted from its source.
      - run: python scripts/vendor_core.py --check
      - run: python scripts/vendor_card.py --check
      # The HA integration's shared field descriptions are [%schema:...%]
      # placeholders into the battery_soc service schema.
      - run: python scripts/render_ha_descriptions.py --check
      # Stdlib-only check path: the geometry libraries the generator needs are
      # imported lazily and are not installed here.
      - run: python scripts/icons/flatten_icons.py --check

  home-assistant-integration:
    name: Home Assistant integration
    needs: changes
    if: needs.changes.outputs.ha == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/homeassistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ../../libs/battery_soc_core -r requirements-test.txt
      - run: pytest

  docs-scripts:
    name: Docs site scripts
    needs: changes
    if: needs.changes.outputs.docs_scripts == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/tests/test_docs_pages.sh

  # Every highlight of this PR (a feat, fix, perf or breaking squash entry in a
  # CHANGELOG.md) needs a German text in changelog/highlights/<PR>.json. Runs
  # on every PR, the check reads only Markdown and JSON. CI is dispatched by
  # the Version bump only after the branch settled, so the changelogs and the
  # translation file are current.
  highlight-translations:
    name: Highlight translations
    needs: changes
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every highlight of this PR has a German text
        env:
          PR_NUMBER: ${{ inputs.pr }}
        run: python3 scripts/build/highlight_translations.py check --repo . --pr "$PR_NUMBER"
      - name: Highlight details are valid
        run: python3 scripts/build/highlight_translations.py validate --repo .

  bootstrap-chain:
    name: Bootstrap chain (double run)
    needs: changes
    if: needs.changes.outputs.shell == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    # Debian bookworm ist das, worauf der Referenz-Node aufsetzt; bash,
    # python3, openssl und tar kommen dort in denselben Fassungen wie auf
    # Raspberry Pi OS Lite.
    container: debian:bookworm
    steps:
      - name: Install prerequisites
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            bash ca-certificates git openssl python3 tar findutils diffutils
      - uses: actions/checkout@v4
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bash scripts/tests/bootstrap_container.sh

  # Single required status check. Always runs; passes only when every job above
  # either succeeded or was legitimately skipped by the path filter. Point the
  # `main` branch-protection rule at this job instead of the individual ones.
  ci-ok:
    name: CI ok
    if: always()
    permissions:
      statuses: write
    needs:
      - changes
      - dashboard-go
      - installer-go
      - dashboard-js
      - installer-webui-go
      - installer-webui-js
      - installer-webui-e2e
      - installer-cross
      - python-bridges
      - shell-scripts
      - docs-scripts
      - highlight-translations
      - bootstrap-chain
      - vendored-artefacts
      - home-assistant-integration
    runs-on: ubuntu-latest
    steps:
      - name: Verify no needed job failed
        id: verify
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Job results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a CI job did not pass (result: $r)"; exit 1 ;;
            esac
          done
      # The PR's commit status "CI" (see the changes job). A cancelled run
      # leaves it pending, which is fine: it was cancelled for a newer head.
      - name: Report the result as commit status CI
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.verify.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            state=success; description="All needed jobs passed"
          else
            state=failure; description="A CI job did not pass"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context=CI -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
