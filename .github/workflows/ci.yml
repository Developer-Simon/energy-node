name: CI

on:
  # `push` only for the post-merge run on `main`. Branch development is covered
  # by `pull_request`, so a plain `push:` here would run every job twice on any
  # branch that has an open PR.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which of the jobs below need to run for this change. On a PR it
  # diffs the head against the PR base; on the post-merge `main` run (or if the
  # diff can't be computed) every area is marked changed so nothing is skipped.
  # A change to the workflow file itself also forces every job to run.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      dashboard: ${{ steps.filter.outputs.dashboard }}
      python: ${{ steps.filter.outputs.python }}
      shell: ${{ steps.filter.outputs.shell }}
      vendored: ${{ steps.filter.outputs.vendored }}
      ha: ${{ steps.filter.outputs.ha }}
    steps:
      # The Version bump workflow keeps the changelog and per-component patch
      # bump current on the PR branch; its bot commit re-triggers CI. Block
      # here until that workflow's check-run for this exact commit has
      # concluded, so the job set below is decided against the settled branch
      # and CI does not burn a full run on the pre-bump state. On the
      # post-merge `main` run and on fork PRs (no bump run) this is skipped.
      - name: Wait for the version bump to settle
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork == false
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_NAME: Bump component versions
        run: |
          for i in $(seq 1 40); do
            runs="$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" \
              --jq '.check_runs[]
                    | select(.name == env.CHECK_NAME)
                    | .status + "/" + (.conclusion // "")' 2>/dev/null || true)"
            echo "attempt ${i}: [${runs//$'\n'/ }]"
            case "$runs" in
              *completed/success*|*completed/skipped*)
                echo "Version bump settled."; exit 0 ;;
              *completed/*)
                echo "::error::the Version bump check did not pass (${runs})"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::timed out waiting for the Version bump check on ${HEAD_SHA}"
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Three-dot: only what this branch changed since it diverged from
            # the base, ignoring commits that landed on the base since then.
            files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" || true)"
          else
            files=""
          fi
          echo "Changed files:"
          printf '%s\n' "$files"

          all() { for o in dashboard python shell vendored ha; do echo "$o=true"; done >> "$GITHUB_OUTPUT"; }

          # No diff (post-merge run, or it could not be computed) or a change to
          # the workflow itself: run everything. This check runs against the
          # unfiltered diff so a docs-only PR does not land here.
          if [ -z "$files" ] || grep -qE '^\.github/workflows/' <<<"$files"; then
            all
            exit 0
          fi

          # Documentation-only changes affect no job. Drop Markdown paths before
          # matching: a docs-only PR has a non-empty diff but nothing left here,
          # so every emit below marks its area false and all jobs skip.
          files="$(printf '%s\n' "$files" | grep -vE '\.md$' || true)"
          echo "Changed files (excluding Markdown):"
          printf '%s\n' "$files"

          emit() { if grep -qE "$2" <<<"$files"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          emit dashboard '^dashboard/'
          emit python    '^(services|libs)/|^scripts/tests/|^requirements-dev\.txt$'
          emit shell     '^scripts/'
          emit vendored  '^dashboard/|^libs/battery_soc_core/|^integrations/homeassistant/|^scripts/vendor_(core|card)\.py$'
          emit ha        '^integrations/homeassistant/|^libs/battery_soc_core/'

  dashboard-go:
    name: Dashboard (Go)
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: dashboard/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  dashboard-js:
    name: Dashboard (JS)
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  python-bridges:
    name: Python bridges
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e libs/energy_node_common -e libs/battery_soc_core pytest
          pip install -r requirements-dev.txt
      - run: pytest services libs scripts/tests -q

  shell-scripts:
    name: Shell scripts
    needs: changes
    if: needs.changes.outputs.shell == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/tests/test_publish_mirror.sh
      - run: bash scripts/tests/test_generate_changelog.sh
      - run: bash scripts/tests/test_generate_changelog_cap.sh
      - run: bash scripts/tests/test_extract_changelog.sh
      - run: bash scripts/tests/test_bump_version.sh
      - run: bash scripts/tests/test_ensure_remote_manifests.sh
      - run: ./scripts/deploy/check_tracked_secrets.sh

  vendored-artefacts:
    name: Vendored artefacts in sync
    needs: changes
    if: needs.changes.outputs.vendored == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Both scripts are stdlib-only and regenerate a checked-in copy;
      # --check exits non-zero when the copy has drifted from its source.
      - run: python scripts/vendor_core.py --check
      - run: python scripts/vendor_card.py --check

  home-assistant-integration:
    name: Home Assistant integration
    needs: changes
    if: needs.changes.outputs.ha == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/homeassistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ../../libs/battery_soc_core -r requirements-test.txt
      - run: pytest

  # Single required status check. Always runs; passes only when every job above
  # either succeeded or was legitimately skipped by the path filter. Point the
  # `main` branch-protection rule at this job instead of the individual ones.
  ci-ok:
    name: CI ok
    if: always()
    needs:
      - changes
      - dashboard-go
      - dashboard-js
      - python-bridges
      - shell-scripts
      - vendored-artefacts
      - home-assistant-integration
    runs-on: ubuntu-latest
    steps:
      - name: Verify no needed job failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Job results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a CI job did not pass (result: $r)"; exit 1 ;;
            esac
          done
