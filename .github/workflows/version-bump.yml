name: Version bump

# Keeps two derived artefacts current on a PR branch, so the squash-merge
# carries both to `main`:
#   1. the per-component patch bump (scripts/version/bump-patch.sh), committed
#      as "chore(release): bump component versions" -- the bump the pre-commit
#      hook used to do before `main` became PR-protected;
#   2. the per-component CHANGELOG.md files (scripts/generate_changelog.sh),
#      committed as "docs(changelog): update changelogs".
#   3. the German highlight texts of the PR description
#      (changelog/highlights/<PR>.json, scripts/build/highlight_translations.py
#      sync), committed together with the changelogs.
# The bump lands first, as its own commit, so generate_changelog.sh sees it in
# the component's git log and can head the open section with the version it
# just produced -- otherwise the changelog would still show the pre-bump
# version until the *next* run caught up.
#
# The push uses a PAT so it re-triggers this workflow. The "Skip when HEAD is
# already a bot commit" guard below is what stops that from looping: a
# changelog or bump commit can never trigger another run of this job.
#
# CI (ci.yml) does not run on PR pushes. The last step here dispatches it once
# the branch has settled: when this run pushed nothing, or when HEAD already is
# the bot's commit. A run that pushes leaves the dispatch to the run its push
# triggers, so CI never checks the pre-bump state. Fork PRs get no bump and
# therefore no CI run.

on:
  pull_request:
    # edited: a changed PR title or description changes the PR's own changelog
    # entry (see CHANGELOG_PR_* below), so it regenerates too.
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: write
  # Dispatch CI for the settled head (last step) and look up earlier CI runs.
  actions: write
  # Mark the commit status CI as queued when dispatching.
  statuses: write

concurrency:
  group: version-bump-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bump:
    name: Bump component versions
    runs-on: ubuntu-latest
    # Skip PRs from forks: the workflow needs push access to the head branch.
    if: github.event.pull_request.head.repo.fork == false
    env:
      # The default GITHUB_TOKEN can push, but its push does not re-trigger the
      # required status checks, so the PR would sit unmergeable. A fine-grained
      # PAT (contents: write), stored as the BUMP_TOKEN secret, does. Without it
      # the job still runs, in check-only mode.
      HAS_TOKEN: ${{ secrets.BUMP_TOKEN != '' }}
      BASE_REF: origin/${{ github.event.pull_request.base.ref }}
      # The PR's own changelog entry (scripts/generate_changelog.sh, "PR-Kontext"):
      # the squash commit does not exist yet, so number, title and description
      # stand in for it. Passed through env, never interpolated into a script.
      CHANGELOG_PR_NUMBER: ${{ github.event.pull_request.number }}
      CHANGELOG_PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      EVENT_ACTION: ${{ github.event.action }}
      # generate_changelog.sh targets. "ha-integration" is intentionally left
      # out: its version stream is manifest.json (v0.2.x) and it has its own
      # HACS/mirror release flow (scripts/publish_mirror.sh); the repo-wide
      # v0.5.x tags would otherwise carve bogus sections into its changelog.
      CHANGELOG_TARGETS: >-
        dashboard services common battery_soc_core
        installer installer-webui bootstrap
        service:apsystems_ez1 service:automation service:battery_soc
        service:shelly service:trucki service:tuya_mqtt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.BUMP_TOKEN || github.token }}

      - name: Fetch base branch
        run: git fetch origin "${{ github.event.pull_request.base.ref }}" --quiet

      - name: Write the PR description for the changelog
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          echo "CHANGELOG_PR_BODY_FILE=$RUNNER_TEMP/pr-body.txt" >> "$GITHUB_ENV"
          echo "CHANGELOG_PR_BASE=$BASE_REF" >> "$GITHUB_ENV"

      # An edit of title or description is no push, so it cannot loop; it must
      # run even when the last push was the bot's own.
      - name: Skip when HEAD is already a bot commit
        id: guard
        run: |
          author="$(git log -1 --format='%an')"
          subject="$(git log -1 --format='%s')"
          if [ "$EVENT_ACTION" != "edited" ] && [ "$author" = "energy-node-bot" ] && {
               [ "$subject" = "chore(release): bump component versions" ] ||
               [ "$subject" = "docs(changelog): update changelogs" ]; }; then
            echo "HEAD is \"$subject\" by $author - nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for pending changelog / version updates
        if: env.HAS_TOKEN != 'true' && steps.guard.outputs.skip != 'true'
        run: |
          echo "::warning::BUMP_TOKEN secret is not set - running in check-only mode." \
            "Create a fine-grained PAT (contents: write) and save it as BUMP_TOKEN" \
            "so this workflow can push the changelog and version bump automatically."
          for t in $CHANGELOG_TARGETS; do scripts/generate_changelog.sh "$t"; done
          git diff --quiet -- '*CHANGELOG.md' \
            || echo "::warning::component changelogs are stale - run scripts/generate_changelog.sh"
          git checkout -- '*CHANGELOG.md'
          scripts/version/bump-patch.sh --check "$BASE_REF"

      - name: Regenerate changelogs, bump versions, push
        id: push
        if: env.HAS_TOKEN == 'true' && steps.guard.outputs.skip != 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "energy-node-bot"
          git config user.email "energy-node-bot@users.noreply.github.com"

          # Per-component patch bump first, as its own commit: generate_changelog.sh
          # reads each component's version off the commit history, and needs this
          # commit in place to head the open section with the bumped version.
          scripts/version/bump-patch.sh "$BASE_REF"
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump component versions"
          fi

          # Changelogs second, so they pick up the bump commit above. The
          # German highlight texts of the PR description go into the same
          # commit (changelog/highlights/<PR>.json), so the guard above still
          # recognises it as a bot commit.
          for t in $CHANGELOG_TARGETS; do scripts/generate_changelog.sh "$t"; done
          python3 scripts/build/highlight_translations.py sync --repo . \
            --pr "$CHANGELOG_PR_NUMBER" --body-file "$CHANGELOG_PR_BODY_FILE"
          git add -- '*CHANGELOG.md' changelog/highlights
          if ! git diff --cached --quiet; then
            git commit -m "docs(changelog): update changelogs"
          fi

          # One push for whatever landed. The guard step no-ops the run this
          # push re-triggers, so it cannot loop.
          if [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ]; then
            echo "Changelogs and versions already current - nothing to push."
          else
            git push origin "HEAD:$HEAD_REF"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Runs when the branch is settled. A title or description edit that
      # changes nothing would dispatch the same head again, so a head that
      # already has a CI run that was not cancelled is left alone.
      - name: Dispatch CI for the settled head
        if: steps.push.outputs.pushed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          sha="$(git rev-parse HEAD)"
          existing="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --event workflow_dispatch --commit "$sha" --json conclusion \
            --jq '[.[] | select(.conclusion != "cancelled")] | length')"
          if [ "${existing:-0}" -gt 0 ]; then
            echo "CI already ran or runs for $sha - not dispatching again."
            exit 0
          fi
          # The PR shows the commit status CI, not the dispatched run. It is set
          # before the dispatch so it can never overwrite the run's own status,
          # and points at the CI runs of this branch until the run takes over.
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
            -f state=pending -f context=CI -f description="Queued by the version bump" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/ci.yml?query=branch%3A${HEAD_REF}" >/dev/null
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF" -f pr="$PR_NUMBER"
          echo "Dispatched CI for $HEAD_REF at $sha (PR #$PR_NUMBER)."
