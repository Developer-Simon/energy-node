if loadfont $prefix/font.pf2 ; then
  set gfxmode=800x600
  set gfxpayload=keep
  insmod efi_gop
  insmod gfxterm
  insmod png
  terminal_output gfxterm
fi
set default=0
set timeout=10
set timeout_style=menu
menuentry 'Energy Node: Debian installieren (loescht die interne Platte)' {
    linux    /install.a64/vmlinuz auto=true priority=critical locale=en_US.UTF-8 keymap=de file=/cdrom/preseed.cfg --- quiet
    initrd   /install.a64/initrd.gz
}
menuentry 'Debian-Installer ohne Automatik' {
    linux    /install.a64/vmlinuz --- quiet
    initrd   /install.a64/initrd.gz
}
