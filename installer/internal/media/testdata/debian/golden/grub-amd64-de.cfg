if loadfont $prefix/font.pf2 ; then
  set gfxmode=800x600
  set gfxpayload=keep
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod gfxterm
  insmod png
  terminal_output gfxterm
fi
set default=0
set timeout=10
set timeout_style=menu
menuentry 'Energy Node: Debian installieren (loescht die interne Platte)' {
    linux    /install.amd/vmlinuz auto=true priority=critical locale=de_DE.UTF-8 keymap=de file=/cdrom/preseed.cfg --- quiet
    initrd   /install.amd/initrd.gz
}
menuentry 'Debian-Installer ohne Automatik' {
    linux    /install.amd/vmlinuz --- quiet
    initrd   /install.amd/initrd.gz
}
