{{define "screen-media"}}<template x-if="screen === 'media-device'">
<div class="screen" x-data="screenMediaDevice">
  <div class="body">
    {{template "stepper"}}

    <template x-if="state === 'unsupported'">
      <div class="media-notice" role="status">
        <span class="media-notice-ic">{{template "icon-warn"}}</span>
        <span class="media-notice-b">
          <span class="media-notice-t" x-text="t('media.unsupported.title')"></span>
          <span class="media-notice-s" x-text="t('media.unsupported.text')"></span>
          <span class="media-notice-actions">
            <button type="button" class="small" @click="openDocs()" x-text="t('action.open')"></button>
          </span>
        </span>
      </div>
    </template>

    <template x-if="state === 'missing'">
      <div class="media-notice" role="status">
        <span class="media-notice-ic">{{template "icon-warn"}}</span>
        <span class="media-notice-b">
          <span class="media-notice-t" x-text="t('media.imager.' + imagerKey + '.title')"></span>
          <span class="media-notice-s" x-text="t('media.imager.' + imagerKey + '.text')"></span>
          <span class="media-notice-actions">
            <template x-for="link in links" :key="link.kind">
              <button type="button" class="small" @click="openLink(link)" x-text="t('media.link.' + link.kind)"></button>
            </template>
            <button type="button" class="small" @click="recheck()" x-text="t('action.recheck')"></button>
          </span>
        </span>
      </div>
    </template>

    <template x-if="state === 'failed'">
      <div class="media-notice" role="status">
        <span class="media-notice-b">
          <span class="media-notice-actions">
            <button type="button" class="small" @click="recheck()" x-text="t('action.retry')"></button>
          </span>
        </span>
      </div>
    </template>

    <template x-if="state === 'ready'">
      <section class="card">
        <h2 class="card-h" x-text="t('media.device.title')"></h2>
        <div role="radiogroup" :aria-label="t('media.device.title')">
          <template x-for="group in groups" :key="group.id">
            <div>
              <div class="media-group" x-text="t('media.group.' + group.id)"></div>
              <template x-for="item in group.devices" :key="item.id">
                <div class="media-opt" :class="{ on: picked === item.id }" role="radio" tabindex="0" :aria-checked="picked === item.id"
                     @click="pick(item.id)" @keydown.enter.prevent="pick(item.id)" @keydown.space.prevent="pick(item.id)">
                  <span class="media-radio" aria-hidden="true"></span>
                  <span class="media-opt-t" x-text="t('media.device.' + item.id)"></span>
                  <template x-if="item.experimental"><span class="media-tag" x-text="tagFor(item)"></span></template>
                </div>
              </template>
            </div>
          </template>
        </div>

        <template x-if="summary && summary.offline">
          <div class="media-res media-res--warn" role="status">
            <span x-text="t('media.result.offline')"></span>
          </div>
        </template>
        <template x-if="summary && !summary.offline">
          <div class="media-res">
            <div class="media-res-t" x-text="summary.name"></div>
            <div class="media-res-s" x-text="summary.pkg + ', ' + summary.size"></div>
            <div class="media-res-s" x-text="summary.cached ? t('media.result.cached') : t('media.result.download')"></div>
          </div>
        </template>
      </section>
    </template>
  </div>

  <footer class="foot">
    <span class="foot-spacer"></span>
    <button type="button" class="primary" :disabled="!canContinue" @click="next()" x-text="t('action.next')"></button>
  </footer>
</div>
</template>

<template x-if="screen === 'media-settings'">
<div class="screen" x-data="screenMediaSettings">
  <div class="body">
    {{template "stepper"}}

    <div class="media-cards" :aria-label="t('media.settings.title')">
      <section class="card">
        <h2 class="card-h" x-text="t('media.settings.system')"></h2>
        <div class="media-row2">
          <div class="media-field">
            <span class="lbl" id="media-hostname" x-text="t('media.settings.hostname')"></span>
            <input type="text" x-model.trim="form.hostname" aria-labelledby="media-hostname" autocomplete="off" spellcheck="false">
            <template x-if="nameState === 'ok'"><div class="media-check media-check--ok" x-text="t('media.name.ok')"></div></template>
            <template x-if="nameState === 'invalid'"><div class="media-check media-check--bad" x-text="t('media.name.invalid')"></div></template>
            <template x-if="nameState === 'taken'">
              <div class="media-check media-check--warn">
                <span x-text="t('media.name.taken', { name: suggestion })"></span>
                <button type="button" class="small" @click="useSuggestion()" x-text="t('media.name.use')"></button>
              </div>
            </template>
          </div>
          <div class="media-field">
            <span class="lbl" id="media-user" x-text="t('media.settings.user')"></span>
            <input type="text" x-model.trim="form.user" aria-labelledby="media-user" autocomplete="off" spellcheck="false">
          </div>
        </div>

        <div class="media-static">
          <span class="media-static-t" x-text="form.emergency && form.sshPassword ? t('media.settings.key_and_password') : t('media.settings.key_only')"></span>
          <span class="media-static-s" x-text="t('media.settings.key_only_hint')"></span>
        </div>

        <label class="media-toggle">
          <span class="settings-toggle">
            <input type="checkbox" role="switch" x-model="form.emergency" :aria-label="t('media.settings.emergency')">
            <span class="settings-toggle-track" aria-hidden="true"><span class="settings-toggle-thumb"></span></span>
          </span>
          <span>
            <span class="media-check-t" x-text="t('media.settings.emergency')"></span>
            <span class="media-check-s" x-text="t('media.settings.emergency_hint')"></span>
          </span>
        </label>

        <template x-if="form.emergency">
          <div>
            <div class="media-row2">
              <div class="media-field">
                <span class="lbl" id="media-password" x-text="t('media.settings.password')"></span>
                <input type="password" x-model="form.password" aria-labelledby="media-password" autocomplete="new-password">
                <template x-if="passwordShort"><div class="media-hint media-hint--bad" x-text="t('media.settings.password_short')"></div></template>
              </div>
              <div class="media-field">
                <span class="lbl" id="media-password2" x-text="t('media.settings.password2')"></span>
                <input type="password" x-model="form.password2" aria-labelledby="media-password2" autocomplete="new-password">
                <template x-if="passwordMismatch"><div class="media-hint media-hint--bad" x-text="t('media.settings.password_mismatch')"></div></template>
              </div>
            </div>
            <label class="media-toggle media-toggle--sub">
              <span class="settings-toggle">
                <input type="checkbox" role="switch" x-model="form.sshPassword" :aria-label="t('media.settings.ssh_password')">
                <span class="settings-toggle-track" aria-hidden="true"><span class="settings-toggle-thumb"></span></span>
              </span>
              <span>
                <span class="media-check-t" x-text="t('media.settings.ssh_password')"></span>
                <span class="media-check-s" x-text="t('media.settings.ssh_password_hint')"></span>
              </span>
            </label>
          </div>
        </template>
      </section>

      <section class="card">
        <h2 class="card-h" x-text="t('media.settings.region')"></h2>
        <div class="media-row2">
          <div class="media-field">
            <span class="lbl" id="media-timezone" x-text="t('media.settings.timezone')"></span>
            <select x-model="form.timezone" aria-labelledby="media-timezone">
              <template x-for="zone in timezones" :key="zone">
                <option :value="zone" :selected="zone === form.timezone" x-text="zone"></option>
              </template>
            </select>
          </div>
          <div class="media-field">
            <span class="lbl" id="media-keyboard" x-text="t('media.settings.keyboard')"></span>
            <select x-model="form.keyboard" aria-labelledby="media-keyboard">
              <template x-for="layout in keyboards" :key="layout">
                <option :value="layout" :selected="layout === form.keyboard" x-text="layout"></option>
              </template>
            </select>
          </div>
        </div>
        <div class="media-hint" x-text="t('media.settings.from_computer')"></div>
      </section>

      <section class="card">
        <h2 class="card-h" x-text="t('media.settings.network')"></h2>
        <label class="media-toggle">
          <span class="settings-toggle">
            <input type="checkbox" role="switch" x-model="form.wifiOn" :aria-label="t('media.settings.wifi')">
            <span class="settings-toggle-track" aria-hidden="true"><span class="settings-toggle-thumb"></span></span>
          </span>
          <span><span class="media-check-t" x-text="t('media.settings.wifi')"></span></span>
        </label>

        <template x-if="form.wifiOn">
          <div>
            <div class="media-field">
              <div class="media-net-head">
                <span class="lbl" id="media-ssid" x-text="t('media.settings.ssid')"></span>
                <template x-if="scanning"><span class="media-net-scan" role="status">{{template "icon-spin"}}<span x-text="t('media.wifi.scanning')"></span></span></template>
              </div>
              <template x-if="rows.length">
                <div class="media-net" role="radiogroup" aria-labelledby="media-ssid">
                  <template x-for="net in rows" :key="net.ssid">
                    <div class="media-opt media-net-row" :class="{ on: !manual && net.ssid === form.ssid }" role="radio" tabindex="0"
                         :aria-checked="!manual && net.ssid === form.ssid"
                         @click="pickNetwork(net.ssid)" @keydown.enter.prevent="pickNetwork(net.ssid)" @keydown.space.prevent="pickNetwork(net.ssid)">
                      <span class="media-radio" aria-hidden="true"></span>
                      <span class="media-opt-t" x-text="net.ssid"></span>
                      <template x-if="net.only5"><span class="media-tag" :class="{ 'media-tag--warn': lacks5 }" x-text="t('media.wifi.only5')"></span></template>
                      <span class="media-sig" :data-level="net.level" role="img" :aria-label="t('media.wifi.signal', { n: net.level })"><i></i><i></i><i></i></span>
                    </div>
                  </template>
                  <div class="media-opt media-net-row" :class="{ on: manual }" role="radio" tabindex="0" :aria-checked="manual"
                       @click="pickOther()" @keydown.enter.prevent="pickOther()" @keydown.space.prevent="pickOther()">
                    <span class="media-radio" aria-hidden="true"></span>
                    <span class="media-opt-t" x-text="t('media.wifi.other')"></span>
                  </div>
                </div>
              </template>
              <template x-if="showInput">
                <input type="text" class="media-net-input" x-ref="ssidInput" x-model.trim="form.ssid" :aria-label="t('media.settings.ssid')" autocomplete="off" spellcheck="false">
              </template>
              <template x-if="fiveGhzOnly">
                <div class="media-check media-check--warn">
                  <span x-text="sibling ? t('media.wifi.five_ghz_sibling', { name: sibling }) : t('media.wifi.five_ghz')"></span>
                  <template x-if="sibling"><button type="button" class="small" @click="pickNetwork(sibling)" x-text="t('media.name.use')"></button></template>
                </div>
              </template>
            </div>
            <div class="media-field">
              <span class="lbl" id="media-wifi-password" x-text="t('media.settings.wifi_password')"></span>
              <input type="password" x-model="form.wifiPassword" aria-labelledby="media-wifi-password" autocomplete="off">
              <template x-if="wifiState === 'match'"><div class="media-check media-check--ok" x-text="wifiVia ? t('media.wifi.match_via', { name: wifiVia }) : t('media.wifi.match')"></div></template>
              <template x-if="wifiState === 'mismatch'"><div class="media-check media-check--warn" x-text="wifiVia ? t('media.wifi.mismatch_via', { name: wifiVia }) : t('media.wifi.mismatch')"></div></template>
              <template x-if="wifiState === 'unknown'"><div class="media-check" x-text="t('media.wifi.unknown')"></div></template>
              <template x-if="wifiState === 'failed'"><div class="media-check" x-text="t('media.wifi.failed')"></div></template>
            </div>
            <template x-if="!countryKnown">
              <div class="media-field">
                <span class="lbl" id="media-country" x-text="t('media.settings.country')"></span>
                <input type="text" maxlength="2" :value="form.country" @input="$event.target.value = $event.target.value.toUpperCase(); form.country = $event.target.value"
                       aria-labelledby="media-country" autocomplete="off" spellcheck="false">
              </div>
            </template>
            <div class="media-hint" x-text="t('media.settings.wifi_hint')"></div>
          </div>
        </template>
      </section>
    </div>
  </div>

  <footer class="foot">
    <button type="button" class="ghost" @click="back()" x-text="t('action.back')"></button>
    <span class="foot-spacer"></span>
    <button type="button" class="primary" :disabled="!canContinue" @click="next()" x-text="t('action.next')"></button>
  </footer>
</div>
</template>
<template x-if="screen === 'media-drive'">
<div class="screen" x-data="screenMediaDrive">
  <div class="body">
    {{template "stepper"}}

    <div class="media-cards">
      <section class="card">
        <h2 class="card-h" x-text="t('media.drive.title')"></h2>
        <template x-if="visible.length === 0">
          <div class="media-hint" role="status" x-text="t('media.drive.empty')"></div>
        </template>
        <div class="media-drives" role="radiogroup" :aria-label="t('media.drive.title')">
          <template x-for="item in visible" :key="item.path">
            <div class="media-opt media-drive" :class="{ on: selected === item.path, 'media-opt--off': !fits(item) }" role="radio" tabindex="0"
                 :aria-checked="selected === item.path" :aria-disabled="!fits(item)"
                 @click="pick(item.path)" @keydown.enter.prevent="pick(item.path)" @keydown.space.prevent="pick(item.path)">
              <span class="media-radio" aria-hidden="true"></span>
              <span class="media-drive-b">
                <span class="media-opt-t" x-text="driveName(item)"></span>
                <span class="media-drive-s" x-text="sizeText(item) + ', ' + item.transport"></span>
              </span>
              <span class="media-tag" :class="{ 'media-tag--warn': !item.removable }" x-text="labelFor(item)"></span>
              <template x-if="!fits(item)"><span class="media-tag" x-text="t('media.drive.too_small')"></span></template>
            </div>
          </template>
        </div>

        <label class="media-toggle">
          <span class="settings-toggle">
            <input type="checkbox" role="switch" :checked="showInternal" @change="setInternal($event.target.checked)" :aria-label="t('media.drive.show_internal')">
            <span class="settings-toggle-track" aria-hidden="true"><span class="settings-toggle-thumb"></span></span>
          </span>
          <span>
            <span class="media-check-t" x-text="t('media.drive.show_internal')"></span>
            <span class="media-check-s" x-text="t('media.drive.show_internal_hint')"></span>
          </span>
        </label>
      </section>

      <template x-if="selectedDrive">
        <section class="card">
          <template x-if="showLayout">
            <div class="media-layout">
              <div class="media-layout-t" x-text="t('media.layout.title')"></div>
              <div class="media-layout-bar" aria-hidden="true">
                <span class="media-layout-boot" x-text="t('media.layout.boot')"></span>
                <span class="media-layout-system" x-text="t('media.layout.system')"></span>
              </div>
              <div class="media-hint" x-text="t('media.layout.pi')"></div>
            </div>
          </template>

          <div class="media-warn">
            <div class="media-warn-t" x-text="t('media.warn.erase', { drive: driveName(selectedDrive) })"></div>
            <template x-if="selectedDrive.partitions.length">
              <div>
                <div class="media-warn-s" x-text="partitionsText(selectedDrive)"></div>
                <ul class="media-parts">
                  <template x-for="part in selectedDrive.partitions" :key="part.name">
                    <li x-text="partitionText(part)"></li>
                  </template>
                </ul>
              </div>
            </template>
            <template x-if="selectedDrive.removable">
              <label class="media-toggle media-warn-check">
                <input type="checkbox" x-model="checked">
                <span class="media-check-t" x-text="t('media.warn.confirm_card')"></span>
              </label>
            </template>
            <template x-if="!selectedDrive.removable">
              <div class="media-field">
                <span class="lbl" id="media-type-name" x-text="t('media.warn.type_name')"></span>
                <input type="text" x-model="typed" :placeholder="selectedDrive.model" aria-labelledby="media-type-name" autocomplete="off" spellcheck="false">
              </div>
            </template>
          </div>
        </section>
      </template>
    </div>
  </div>

  <footer class="foot">
    <button type="button" class="ghost" @click="back()" x-text="t('action.back')"></button>
    <span class="foot-spacer"></span>
    <button type="button" class="media-erase" :disabled="!canErase" @click="erase()" x-text="t('media.action.erase_write')"></button>
  </footer>
</div>
</template>

<template x-if="screen === 'media-write'">
<div class="screen" x-data="screenMediaWrite">
  <div class="body">
    {{template "stepper"}}

    <section class="card">
      <h2 class="card-h" x-text="t('media.write.title')"></h2>
      <ol class="media-steps">
        <template x-for="row in rows" :key="row.id">
          <li class="media-step" :class="'media-step--' + row.state">
            <span class="media-step-ic">
              <template x-if="row.state === 'done'">{{template "icon-step-done"}}</template>
              <template x-if="row.state === 'active'">{{template "icon-spin"}}</template>
              <template x-if="row.state === 'failed'">{{template "icon-bad"}}</template>
            </span>
            <span x-text="t(row.labelKey)"></span>
          </li>
        </template>
      </ol>

      <div class="media-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="percent" :aria-label="t('media.write.title')">
        <span class="media-bar-fill" :style="{ width: percent + '%' }"></span>
      </div>
      <div class="media-hint" x-text="remainingText"></div>
      <template x-if="running">
        <div class="media-hint" x-text="t('media.write.cancel_hint')"></div>
      </template>

      <details class="media-log">
        <summary x-text="t('media.write.log')"></summary>
        <pre class="media-log-body" x-text="log.join('\n')"></pre>
        <button type="button" class="small" @click="save()" x-text="t('media.write.save_log')"></button>
      </details>
    </section>
  </div>

  <footer class="foot">
    <span class="foot-spacer"></span>
    <template x-if="running"><button type="button" class="ghost" @click="cancel()" x-text="t('action.cancel')"></button></template>
    <template x-if="failed"><button type="button" class="ghost" @click="back()" x-text="t('action.back')"></button></template>
    <template x-if="failed"><button type="button" class="primary" @click="retry()" x-text="t('action.retry')"></button></template>
  </footer>
</div>
</template>

<template x-if="screen === 'media-done'">
<div class="screen" x-data="screenMediaDone">
  <div class="body">
    {{template "stepper"}}

    <div class="media-cards">
      <section class="card">
        <h2 class="card-h" x-text="t('media.done.title')"></h2>
        <ol class="media-list">
          <li x-text="t('media.done.pi.1')"></li>
          <li x-text="t('media.done.pi.2')"></li>
          <li x-text="t('media.done.pi.3', { host: address })"></li>
        </ol>

        <template x-if="waiting">
          <div class="media-status" role="status">
            <span class="media-status-ic media-spin">{{template "icon-spin"}}</span>
            <span x-text="t('media.done.waiting', { host: address })"></span>
            <span class="media-clock" x-text="elapsed"></span>
          </div>
        </template>
        <template x-if="found">
          <div class="media-check media-check--ok" role="status" x-text="t('media.done.found', { host: address })"></div>
        </template>
        <template x-if="foreign">
          <div class="media-check media-check--warn" role="status" x-text="t('media.done.foreign', { host: address })"></div>
        </template>
      </section>

      <template x-if="slow && !found">
        <section class="card">
          <div class="media-warn">
            <div class="media-warn-t" x-text="t('media.done.slow.title')"></div>
            <ul class="media-parts">
              <li x-text="t('media.done.slow.network')"></li>
              <li x-text="t('media.done.slow.mdns')"></li>
              <li x-text="t('media.done.slow.boot')"></li>
            </ul>
            <div class="media-field">
              <span class="lbl" id="media-done-ip" x-text="t('media.done.ip')"></span>
              <input type="text" x-model.trim="ip" @change="check()" aria-labelledby="media-done-ip" autocomplete="off" spellcheck="false">
            </div>
          </div>
        </section>
      </template>
    </div>
  </div>

  <footer class="foot">
    <button type="button" class="ghost" @click="another()" x-text="t('media.action.another')"></button>
    <span class="foot-spacer"></span>
    <button type="button" class="primary" @click="toSetup()" x-text="t('media.action.to_setup')"></button>
  </footer>
</div>
</template>
{{end}}
