{{define "screen-preview"}}<template x-if="screen === 'preview'">
<div class="screen" x-data="screenPreview">
  <div class="body">
    {{template "stepper"}}

    <div class="vd">
      <span class="vd-lbl" x-text="t('preview.package')"></span>
      <template x-if="fromVersion"><span class="vd-from" x-text="fromVersion"></span></template>
      <template x-if="fromVersion"><span class="vd-arr">{{template "icon-arrow"}}</span></template>
      <span class="vd-to" x-text="toVersion"></span>
      <span class="vd-note" x-text="note"></span>
    </div>

    <div class="cols">
      <section class="card">
        <h2 class="card-h" x-text="t('preview.changes.heading')"></h2>
        <p class="card-p" x-text="t('preview.changes.text')"></p>

        <template x-if="whatsNew">
          <div class="whatsnew">
            <div class="whatsnew-b">
              <span class="whatsnew-t" x-text="t('preview.whatsnew.text')"></span>
              <span class="whatsnew-l" :class="{ 'has-breaking': changelog.breaking > 0 }" x-text="whatsNewLine"></span>
            </div>
            <button type="button" class="small" @click="openChangelog()" x-text="t('changelog.open')"></button>
          </div>
        </template>

        <template x-for="row in components" :key="row.key">
          <div class="vr">
            <span class="vr-d" :class="{ rep: row.changed }"></span>
            <span class="vr-n"><span x-text="row.label"></span><template x-if="row.em"><span> <em x-text="row.em"></em></span></template></span>
            <template x-if="row.changed"><span class="vr-v"><span class="o" x-text="row.from"></span> → <span class="n" x-text="row.to"></span></span></template>
            <template x-if="!row.changed"><span class="vr-v" x-text="row.to"></span></template>
          </div>
        </template>

        <div class="keep">
          <span class="keep-t" x-text="t('preview.restart.heading')"></span>
          <div class="keep-l">
            <template x-if="!restart.length"><span x-text="t('preview.restart.none')"></span></template>
            <template x-for="row in restart" :key="row.unit"><div><em x-text="row.unit"></em> · <span x-text="row.reason"></span></div></template>
          </div>
          <div class="restart-all">
            <label class="settings-toggle">
              <input type="checkbox" role="switch" x-model="restartAll" :disabled="busy" :aria-label="t('preview.restart.all')">
              <span class="settings-toggle-track" aria-hidden="true"><span class="settings-toggle-thumb"></span></span>
            </label>
            <span x-text="t('preview.restart.all')"></span>
          </div>
          <span class="keep-t" style="margin-top:.5rem" x-text="t('preview.keep.heading')"></span>
          <div class="keep-l"><span x-text="keepNames"></span><template x-if="keepNames"><span x-text="t('preview.keep.separator')"></span></template><em x-text="t('preview.keep.config')"></em><span x-text="t('preview.keep.secrets')"></span></div>
        </div>
      </section>

      <div class="stack">
        <section class="card">
          <h2 class="card-h" x-text="t('preview.scope.heading')"></h2>
          <p class="card-p" x-text="t('preview.scope.text')"></p>
          <div class="mods mods-ro">
            <template x-for="mod in (mods ? mods.services : [])" :key="mod.id">
              <div class="mod" :class="{ on: mod.on }">
                <span class="mod-ic">
                  <template x-if="mod.icon === 'automation'">{{template "icon-mod-automation"}}</template>
                  <template x-if="mod.icon === 'solar-panel'">{{template "icon-mod-solar-panel"}}</template>
                  <template x-if="mod.icon === 'battery'">{{template "icon-mod-battery"}}</template>
                  <template x-if="mod.icon === 'plug-smart'">{{template "icon-mod-plug-smart"}}</template>
                  <template x-if="mod.icon === 'lightning-bolt-circle'">{{template "icon-mod-lightning-bolt-circle"}}</template>
                  <template x-if="mod.icon === 'tuya'">{{template "icon-mod-tuya"}}</template>
                  <template x-if="mod.icon === 'tailscale'">{{template "icon-mod-tailscale"}}</template>
                  <template x-if="mod.icon === 'lock'">{{template "icon-mod-lock"}}</template>
                  <template x-if="mod.icon === 'refresh'">{{template "icon-mod-refresh"}}</template>
                  <template x-if="mod.icon === 'drive'">{{template "icon-mod-drive"}}</template>
                  <template x-if="mod.icon === 'network'">{{template "icon-mod-network"}}</template>
                  <template x-if="mod.icon === 'history'">{{template "icon-mod-history"}}</template>
                  <template x-if="mod.icon === 'device'">{{template "icon-mod-device"}}</template>
                </span>
                <span class="mod-nm"><span class="mod-long" x-text="mod.name"></span><span class="mod-short" x-text="mod.short"></span><template x-if="mod.isNew"><span class="svc-tag" x-text="t('preview.scope.new')"></span></template></span>
                <span class="mod-st" x-text="mod.state"></span>
              </div>
            </template>
          </div>
          <div class="mods mods-ro" x-show="mods && mods.tuning.length">
            <template x-for="mod in (mods ? mods.tuning : [])" :key="mod.id">
              <div class="mod" :class="{ on: mod.on }">
                <span class="mod-ic">
                  <template x-if="mod.icon === 'automation'">{{template "icon-mod-automation"}}</template>
                  <template x-if="mod.icon === 'solar-panel'">{{template "icon-mod-solar-panel"}}</template>
                  <template x-if="mod.icon === 'battery'">{{template "icon-mod-battery"}}</template>
                  <template x-if="mod.icon === 'plug-smart'">{{template "icon-mod-plug-smart"}}</template>
                  <template x-if="mod.icon === 'lightning-bolt-circle'">{{template "icon-mod-lightning-bolt-circle"}}</template>
                  <template x-if="mod.icon === 'tuya'">{{template "icon-mod-tuya"}}</template>
                  <template x-if="mod.icon === 'tailscale'">{{template "icon-mod-tailscale"}}</template>
                  <template x-if="mod.icon === 'lock'">{{template "icon-mod-lock"}}</template>
                  <template x-if="mod.icon === 'refresh'">{{template "icon-mod-refresh"}}</template>
                  <template x-if="mod.icon === 'drive'">{{template "icon-mod-drive"}}</template>
                  <template x-if="mod.icon === 'network'">{{template "icon-mod-network"}}</template>
                  <template x-if="mod.icon === 'history'">{{template "icon-mod-history"}}</template>
                  <template x-if="mod.icon === 'device'">{{template "icon-mod-device"}}</template>
                </span>
                <span class="mod-nm"><span class="mod-long" x-text="mod.name"></span><span class="mod-short" x-text="mod.short"></span><template x-if="mod.isNew"><span class="svc-tag" x-text="t('preview.scope.new')"></span></template></span>
                <span class="mod-st" x-text="mod.state"></span>
              </div>
            </template>
          </div>
          <template x-if="updatesLine">
            <p class="mod-hint"><template x-if="updatesLine.detail"><span class="svc-d" x-text="updatesLine.detail"></span></template><template x-if="updatesLine.check"><button type="button" class="svc-check" @click="checkUpdates()" x-text="t('system_updates.check')"></button></template></p>
          </template>
          <button type="button" class="small ghost svc-edit" :disabled="busy || !manifest" @click="editServices()" x-text="t('action.edit_services')"></button>
        </section>

        <template x-if="showReuse">
          <section class="card soft">
            <p class="reuse" x-text="t('preview.reuse')"></p>
          </section>
        </template>
      </div>
    </div>
  </div>

  <footer class="foot">
    <button type="button" class="ghost" :disabled="busy" @click="cancel()" x-text="t('action.cancel')"></button>
    <span class="foot-spacer"></span>
    <span class="foot-hint" x-text="t('configure.hint.mutates')"></span>
    <template x-if="canApplySelection">
      <button type="button" class="primary" :disabled="busy" @click="applySelection()" x-text="t('action.apply_services')"></button>
    </template>
    <template x-if="!canApplySelection">
      <button type="button" class="primary" :disabled="!canStart" @click="start()" x-text="t('action.update')"></button>
    </template>
  </footer>
</div>
</template>{{end}}
