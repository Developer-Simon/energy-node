{{define "screen-configure"}}<template x-if="screen === 'configure'">
<div class="screen" x-data="screenConfigure">
  <div class="body">
    {{template "stepper"}}

    <div class="cols">
      <template x-if="!servicesOnly">
        <div class="stack">
          <section class="card">
            <h2 class="card-h" x-text="t('configure.credentials.heading')"></h2>
            <p class="card-p" x-text="t('configure.credentials.text')"></p>
            <div class="row2">
              <div class="field">
                <span class="lbl" id="configure-mqtt-user" x-text="t('field.mqtt_user')"></span>
                <input type="text" x-model.trim="mqttUser" aria-labelledby="configure-mqtt-user" autocomplete="off" spellcheck="false">
              </div>
              <div class="field">
                <span class="lbl" id="configure-mqtt-password" x-text="t('field.mqtt_password')"></span>
                <span class="inp-wrap">
                  <input :type="showMqtt ? 'text' : 'password'" x-model="mqttPassword" aria-labelledby="configure-mqtt-password" autocomplete="new-password">
                  <button type="button" @click="showMqtt = !showMqtt" :aria-pressed="showMqtt" :aria-label="t('action.show_password')">{{template "icon-eye"}}</button>
                </span>
              </div>
            </div>
            <div class="field">
              <span class="lbl" id="configure-admin-password" x-text="t('field.admin_password')"></span>
              <span class="inp-wrap">
                <input :type="showAdmin ? 'text' : 'password'" x-model="adminPassword" aria-labelledby="configure-admin-password" autocomplete="new-password">
                <button type="button" @click="showAdmin = !showAdmin" :aria-pressed="showAdmin" :aria-label="t('action.show_password')">{{template "icon-eye"}}</button>
              </span>
            </div>
            <p class="hint"><span x-text="t('configure.secrets.before')"></span><em x-text="t('configure.secrets.mqtt_path')"></em><span x-text="t('configure.secrets.between')"></span><em x-text="t('configure.secrets.admin_path')"></em><span x-text="t('configure.secrets.after')"></span></p>
            <div class="field">
              <span class="lbl" id="configure-hotspot-password" x-text="t('field.hotspot_password')"></span>
              <span class="inp-wrap">
                <input :type="showHotspot ? 'text' : 'password'" x-model="hotspotPassword" aria-labelledby="configure-hotspot-password" autocomplete="new-password" spellcheck="false">
                <button type="button" @click="showHotspot = !showHotspot" :aria-pressed="showHotspot" :aria-label="t('action.show_password')">{{template "icon-eye"}}</button>
              </span>
            </div>
            <p class="hint" x-text="t('configure.hotspot.hint')"></p>
          </section>

          <section class="card">
            <h2 class="card-h" x-text="t('configure.target.heading')"></h2>
            <div class="row2">
              <div class="field">
                <span class="lbl" id="configure-target-user" x-text="t('field.target_user')"></span>
                <input type="text" x-model.trim="targetUser" aria-labelledby="configure-target-user" autocomplete="off" spellcheck="false">
              </div>
              <div class="field">
                <span class="lbl" id="configure-target-base" x-text="t('field.target_base')"></span>
                <input type="text" x-model.trim="targetBase" aria-labelledby="configure-target-base" autocomplete="off" spellcheck="false">
              </div>
            </div>
          </section>
        </div>
      </template>

      <template x-if="mods">
      <div class="stack">
        <section class="card mods-card">
          <div class="mods-head"><h2 class="card-h" x-text="t('configure.services.heading')"></h2><span class="mods-count" x-text="t('configure.services.count', mods.count)"></span></div>
          <p class="card-p" x-text="t('configure.services.text')"></p>
          <div class="mods">
          <template x-for="mod in mods.services" :key="mod.id">
            <button type="button" class="mod" role="switch" :class="{ on: mod.on }" :aria-checked="mod.on" :aria-describedby="'mod-hint-' + mod.id" @click="toggleModule(mod)" @focus="showHint(mod)">
              <span class="mod-ic">
                <template x-if="mod.icon === 'automation'">{{template "icon-mod-automation"}}</template>
                <template x-if="mod.icon === 'solar-panel'">{{template "icon-mod-solar-panel"}}</template>
                <template x-if="mod.icon === 'battery'">{{template "icon-mod-battery"}}</template>
                <template x-if="mod.icon === 'plug-smart'">{{template "icon-mod-plug-smart"}}</template>
                <template x-if="mod.icon === 'lightning-bolt-circle'">{{template "icon-mod-lightning-bolt-circle"}}</template>
                <template x-if="mod.icon === 'tuya'">{{template "icon-mod-tuya"}}</template>
                <template x-if="mod.icon === 'tailscale'">{{template "icon-mod-tailscale"}}</template>
                <template x-if="mod.icon === 'lock'">{{template "icon-mod-lock"}}</template>
                <template x-if="mod.icon === 'refresh'">{{template "icon-mod-refresh"}}</template>
                <template x-if="mod.icon === 'drive'">{{template "icon-mod-drive"}}</template>
                <template x-if="mod.icon === 'network'">{{template "icon-mod-network"}}</template>
                <template x-if="mod.icon === 'history'">{{template "icon-mod-history"}}</template>
                <template x-if="mod.icon === 'play'">{{template "icon-mod-play"}}</template>
                <template x-if="mod.icon === 'device'">{{template "icon-mod-device"}}</template>
              </span>
              <span class="mod-nm"><span class="mod-long" x-text="mod.name"></span><span class="mod-short" x-text="mod.short"></span></span>
              <span class="mod-st" x-text="mod.state"></span>
              <span class="sr-only" :id="'mod-hint-' + mod.id" x-text="mod.hint"></span>
            </button>
          </template>
          </div>
          <p class="mod-hint" aria-hidden="true" x-text="hintText.services"></p>
        </section>
        <section class="card mods-card">
          <div class="mods-head"><h2 class="card-h" x-text="t('configure.tuning.heading')"></h2></div>
          <div class="mods">
          <template x-for="mod in mods.tuning" :key="mod.id">
            <button type="button" class="mod" role="switch" :class="{ on: mod.on }" :aria-checked="mod.on" :aria-describedby="'mod-hint-' + mod.id" @click="toggleModule(mod)" @focus="showHint(mod)" x-show="mod.available">
              <span class="mod-ic">
                <template x-if="mod.icon === 'automation'">{{template "icon-mod-automation"}}</template>
                <template x-if="mod.icon === 'solar-panel'">{{template "icon-mod-solar-panel"}}</template>
                <template x-if="mod.icon === 'battery'">{{template "icon-mod-battery"}}</template>
                <template x-if="mod.icon === 'plug-smart'">{{template "icon-mod-plug-smart"}}</template>
                <template x-if="mod.icon === 'lightning-bolt-circle'">{{template "icon-mod-lightning-bolt-circle"}}</template>
                <template x-if="mod.icon === 'tuya'">{{template "icon-mod-tuya"}}</template>
                <template x-if="mod.icon === 'tailscale'">{{template "icon-mod-tailscale"}}</template>
                <template x-if="mod.icon === 'lock'">{{template "icon-mod-lock"}}</template>
                <template x-if="mod.icon === 'refresh'">{{template "icon-mod-refresh"}}</template>
                <template x-if="mod.icon === 'drive'">{{template "icon-mod-drive"}}</template>
                <template x-if="mod.icon === 'network'">{{template "icon-mod-network"}}</template>
                <template x-if="mod.icon === 'history'">{{template "icon-mod-history"}}</template>
                <template x-if="mod.icon === 'play'">{{template "icon-mod-play"}}</template>
                <template x-if="mod.icon === 'device'">{{template "icon-mod-device"}}</template>
              </span>
              <span class="mod-nm"><span class="mod-long" x-text="mod.name"></span><span class="mod-short" x-text="mod.short"></span></span>
              <span class="mod-st" x-text="mod.state"></span>
              <span class="sr-only" :id="'mod-hint-' + mod.id" x-text="mod.hint"></span>
            </button>
          </template>
          </div>
          <p class="mod-hint" aria-hidden="true" x-text="hintText.tuning"></p>
          <template x-if="mods.unavailable"><p class="mods-na" x-text="mods.unavailable"></p></template>
        </section>
        <template x-if="mods.example">
          <label class="card ex" :class="{ on: mods.example.on }">
            <span class="ex-ic">{{template "icon-mod-play"}}</span>
            <span class="ex-txt"><span class="ex-t" x-text="t('step.89')"></span><span class="ex-s" x-text="mods.example.available ? t('configure.example.text') : t('configure.example.needs')"></span></span>
            <span class="settings-toggle"><input type="checkbox" role="switch" :checked="mods.example.on" :disabled="!mods.example.available" @change="toggleModule(mods.example)"><span class="settings-toggle-track"><span class="settings-toggle-thumb"></span></span></span>
          </label>
        </template>
        <div class="later"><span x-text="t('configure.later.before')"></span><em x-text="t('configure.later.file')"></em><span x-text="t('configure.later.after')"></span></div>
      </div>
      </template>
    </div>
  </div>

  <footer class="foot">
    <button type="button" class="ghost" @click="back()" x-text="t('action.back')"></button>
    <span class="foot-spacer"></span>
    <span class="foot-hint" x-text="servicesOnly ? t('configure.hint.selection') : t('configure.hint.mutates')"></span>
    <template x-if="!servicesOnly"><button type="button" class="primary" :disabled="!canStart" @click="start()" x-text="t('action.next')"></button></template>
    <template x-if="servicesOnly"><button type="button" class="primary" :disabled="!canApply" @click="apply()" x-text="t('action.apply_selection')"></button></template>
  </footer>
</div>
</template>{{end}}
