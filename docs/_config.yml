# GitHub Pages configuration for the documentation site.
#
# Built and deployed by .github/workflows/pages.yml (Settings -> Pages ->
# Source "GitHub Actions"), which only redeploys when a document in
# _data/nav.yml or a build input changed. The workflow also generates
# _data/doc_versions.yml for the version marker under each document.

title: Energy Node
description: >-
  Energy monitoring and automation for a remote site — solar, battery and
  switchable loads on a single small Linux box, mirrored to Home Assistant
  over a VPN.

# All three are on the GitHub Pages allow-list (actions/jekyll-build-pages).
# jekyll-relative-links rewrites the .md links between documents to their
# generated URLs, jekyll-redirect-from keeps the URLs of moved pages alive
# (with _layouts/redirect.html, which carries the #anchor along).
plugins:
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-redirect-from

relative_links:
  enabled: true
  collections: false

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - _internal
  - superpowers

# Repository used for "Edit on GitHub" and the header link when the build
# has no site.github metadata (local builds).
repository: Developer-Simon/energy-node
