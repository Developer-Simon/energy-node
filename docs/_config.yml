# GitHub Pages configuration for the documentation site.
#
# Built and deployed by .github/workflows/pages.yml (Settings -> Pages ->
# Source "GitHub Actions"), which only redeploys when a document in
# _data/nav.yml or a build input changed. The workflow also generates
# _data/doc_versions.yml for the version marker under each document.

title: Energy Node
description: >-
  Energy monitoring and automation for a remote site — solar, battery and
  switchable loads on a single small Linux box, mirrored to Home Assistant
  over a VPN.

theme: jekyll-theme-cayman

# jekyll-relative-links is enabled by default on GitHub Pages and rewrites
# the .md links between these documents to their generated URLs. Listing it
# keeps a local `bundle exec jekyll serve` behaving the same way.
plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
