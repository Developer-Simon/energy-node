<!-- Render the ```mermaid fences in these documents as diagrams.
     Kramdown emits them as <pre><code class="language-mermaid">, which
     Mermaid does not pick up on its own, so convert them first.

     The fences themselves must be wrapped in {% raw %} ... {% endraw %}
     in the Markdown: Jekyll runs Liquid before Kramdown, and Mermaid's
     hexagon-node syntax  X{{"label"}}  otherwise looks like a Liquid
     expression and gets stripped to  X"label" , which Mermaid rejects
     with "Syntax error in text". -->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
  mermaid.initialize({ startOnLoad: false, theme: "default" });
  document.addEventListener("DOMContentLoaded", () => {
    for (const code of document.querySelectorAll("code.language-mermaid")) {
      const pre = document.createElement("pre");
      pre.className = "mermaid";
      pre.textContent = code.textContent;
      code.closest("pre")?.replaceWith(pre);
    }
    mermaid.run();
  });
</script>
