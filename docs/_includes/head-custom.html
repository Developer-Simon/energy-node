<!-- Theme before first paint: an explicit choice from the toggle wins over
     the system setting. Without a stored choice no attribute is set and the
     prefers-color-scheme rules in site.css apply. -->
<script>
  try {
    var t = localStorage.getItem("en-docs-theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<!-- Render the ```mermaid fences as diagrams. Kramdown emits them as
     <pre><code class="language-mermaid">, which Mermaid does not pick up on
     its own, so convert them first and keep the source in data-src for a
     re-render when the theme changes (site.js fires en:themechange).

     The fences must be wrapped in {% raw %} ... {% endraw %} in the
     Markdown: Jekyll runs Liquid before Kramdown, and Mermaid's hexagon-node
     syntax  X{{"label"}}  otherwise looks like a Liquid expression. -->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
  const isDark = () => {
    const t = document.documentElement.dataset.theme;
    return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  };
  const render = async () => {
    const nodes = document.querySelectorAll("pre.mermaid");
    if (!nodes.length) return;
    mermaid.initialize({ startOnLoad: false, theme: isDark() ? "dark" : "default" });
    for (const el of nodes) {
      el.removeAttribute("data-processed");
      el.textContent = el.dataset.src;
    }
    await mermaid.run({ nodes });
  };
  const start = () => {
    for (const code of document.querySelectorAll("code.language-mermaid")) {
      const pre = document.createElement("pre");
      pre.className = "mermaid";
      pre.dataset.src = code.textContent;
      pre.textContent = code.textContent;
      (code.closest("div.highlighter-rouge") || code.closest("pre")).replaceWith(pre);
    }
    render();
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
  document.addEventListener("en:themechange", render);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    if (!document.documentElement.dataset.theme) render();
  });
</script>
