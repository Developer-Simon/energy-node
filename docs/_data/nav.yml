# Sidebar navigation for the documentation site (see _includes/nav.html).
# `url` is the source path relative to /docs, always in double quotes
# (scripts/docs/pages-should-deploy.sh greps for url: "..."). An entry may
# carry `children`, up to grandchildren. Keep the reading order a newcomer
# should follow. scripts/docs/check_site.py fails on a missing source file,
# a published page without an entry, or a deeper tree.

