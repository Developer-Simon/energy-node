# Sidebar navigation for the documentation site (see _layouts/default.html).
# `url` is the source path relative to /docs; the layout turns it into the
# generated URL and marks the current page. Keep this in the reading order
# a newcomer should follow.
#
# A group carries either `items` (a flat list) or `sections` (labelled
# sub-groups, each with its own `items`) - the layout renders the group
# title as <h2> and each section label as <h3>.

