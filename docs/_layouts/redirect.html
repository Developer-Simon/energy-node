<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <title>Redirecting…</title>
    <link rel="canonical" href="{{ page.redirect.to }}">
    <meta name="robots" content="noindex">
    <script>location.replace({{ page.redirect.to | jsonify }} + location.hash);</script>
    <meta http-equiv="refresh" content="0; url={{ page.redirect.to }}">
  </head>
  <body>
    <p><a href="{{ page.redirect.to }}">This page has moved.</a></p>
  </body>
</html>
