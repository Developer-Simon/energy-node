[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-soc-core"
dynamic = ["version"]
description = "Transport-agnostic LiFePO4 state-of-charge core shared by the MQTT service and the Home Assistant integration"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["battery_soc_core*"]

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }
