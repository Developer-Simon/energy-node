[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-node-common"
dynamic = ["version"]
description = "Gemeinsame MQTT/Home-Assistant-Slave-Infrastruktur fuer die Energy-Node Python-Bridges"
requires-python = ">=3.9"
dependencies = [
    "paho-mqtt>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["energy_node_common*"]

# VERSION wird wie dashboard/VERSION und services/VERSION vom `Version bump`-
# Workflow gepflegt (siehe COMPONENTS in scripts/version/components.sh) - eine
# einzige Quelle statt einer manuell synchron zu haltenden Versionsangabe hier.
[tool.setuptools.dynamic]
version = { file = ["VERSION"] }
