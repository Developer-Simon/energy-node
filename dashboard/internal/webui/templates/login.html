{{define "login"}}
<!DOCTYPE html>
<html lang="{{.Lang}}" data-base-path="{{.BasePath}}" data-theme="{{.Theme}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{t "login.title"}} | Energy Node Dashboard</title>
  <style>
    /* Eigene Kopie der Tokens: die Anmeldeseite rendert ohne base.html und
       lädt kein Stylesheet, damit sie auch bei kaputtem Asset-Pfad noch
       bedienbar ist. Werte sind mit base.css abzugleichen. */
    :root { color-scheme: dark; --bg: #111418; --panel: #171a20; --border: #46515d; --text: #e6e6e6; --text-subtle: #b8c7d9; --accent: #9fd; --accent-ink: #0f1216; --bad: #f08b8b; }
    :root[data-theme="stromblau"] { --bg: #0c1420; --panel: #131f2f; --border: #34506b; --text: #dce7f2; --text-subtle: #a9bdd0; --accent: #5ec8ff; --accent-ink: #0a1520; --bad: #f08b8b; }
    :root[data-theme="signalgelb"] { --bg: #131313; --panel: #1e1e1e; --border: #3d3d3d; --text: #f2f2f0; --text-subtle: #c2c2ba; --accent: #f5c400; --accent-ink: #171400; --bad: #f2665c; }
    :root[data-theme="tageslicht"] { color-scheme: light; --bg: #f3f1ec; --panel: #ffffff; --border: #c3c9cf; --text: #1b2027; --text-subtle: #3f4750; --accent: #0f9e7a; --accent-ink: #ffffff; --bad: #c23b3b; }

    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 1.5rem; box-sizing: border-box; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, sans-serif; }
    main { width: min(28rem, 100%); padding: 2rem; border: 1px solid var(--border); border-left: 3px solid var(--accent); background: var(--panel); box-sizing: border-box; }
    h1 { margin: 0 0 .35rem; font-size: 1.4rem; color: var(--accent); }
    p { color: var(--text-subtle); }
    form { display: grid; gap: .8rem; margin-top: 1.5rem; }
    label { display: grid; gap: .35rem; color: var(--text-subtle); }
    input { padding: .65rem; border: 1px solid var(--border); border-radius: 3px; background: var(--bg); color: var(--text); font: inherit; }
    button { padding: .65rem .9rem; border: 0; border-radius: 3px; background: var(--accent); color: var(--accent-ink); font: inherit; cursor: pointer; }
    button.secondary { border: 1px solid var(--border); background: transparent; color: var(--text-subtle); }
    button:disabled { cursor: wait; opacity: .6; }
    .actions { display: grid; gap: .6rem; margin-top: .4rem; }
    .message { min-height: 1.4rem; margin: .8rem 0 0; color: var(--bad); }
    .lang-switch { display: flex; justify-content: flex-end; margin: 0 0 1rem; }
    .lang-switch select { padding: .3rem .5rem; border: 1px solid var(--border); border-radius: 3px; background: var(--bg); color: var(--text); font: inherit; font-size: .9rem; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .admin-auth-warning { margin: 0 0 1rem; padding: .7rem .9rem; border: 1px solid var(--bad); border-left-width: 3px; color: var(--bad); font-size: .92rem; }
  </style>
</head>
<body>
  <main>
    <label class="lang-switch">
      <span class="visually-hidden">{{t "language.label"}}</span>
      <select data-lang-select>{{range .Languages}}<option value="{{.Code}}"{{if .Active}} selected{{end}}>{{.Name}}</option>{{end}}</select>
    </label>
    <h1>Energy Node Dashboard</h1>
    {{if .AdminAuthWarning}}<p class="admin-auth-warning" role="alert">{{.AdminAuthWarning}}</p>{{end}}
    <p>{{if .GuestOnly}}{{t "login.guest_only_hint"}}{{else}}{{t "login.prompt"}}{{end}}</p>
    <form id="login-form">
      <label>{{t "login.username"}} <input name="username" autocomplete="username" required{{if .GuestOnly}} disabled{{end}}></label>
      <label>{{t "login.password"}} <input name="password" type="password" autocomplete="current-password" required{{if .GuestOnly}} disabled{{end}}></label>
      <div class="actions">
        <button type="submit"{{if .GuestOnly}} disabled{{end}}>{{t "login.submit"}}</button>
        <button class="secondary" id="guest-login" type="button">{{t "login.guest"}}</button>
      </div>
    </form>
    <div class="message" id="login-message" role="alert" data-failed="{{t "login.request_failed"}}"></div>
  </main>
  <script src="{{.BasePath}}/static/js/i18n.js?v=1"></script>
  <script>
    (() => {
      const base = document.documentElement.dataset.basePath || '';
      const form = document.getElementById('login-form');
      const guestButton = document.getElementById('guest-login');
      const message = document.getElementById('login-message');
      const request = async (url, options) => {
        const response = await fetch(url, options);
        const body = await response.json();
        if (!response.ok) throw new Error(body.message || message.dataset.failed);
        return body;
      };
      const busy = (value) => { if (form) form.querySelector('button[type="submit"]').disabled = value; guestButton.disabled = value; };
      const continueWith = async (url, options) => {
        busy(true);
        message.textContent = '';
        try { await request(url, options); window.location.assign(`${base}/`); }
        catch (error) { message.textContent = error.message; busy(false); }
      };
      if (form) form.addEventListener('submit', (event) => {
          event.preventDefault();
          const data = new FormData(form);
          continueWith(`${base}/api/v1/auth/login`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: data.get('username'), password: data.get('password')})});
        });
      guestButton.addEventListener('click', () => continueWith(`${base}/api/v1/auth/guest`, {method: 'POST'}));
    })();
  </script>
</body>
</html>
{{end}}
