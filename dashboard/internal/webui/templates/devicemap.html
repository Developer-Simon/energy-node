{{define "devicemap"}}
<section id="devicemap-panel" class="panel" role="tabpanel" aria-labelledby="tab-devicemap" x-bind:class="{ active: activePanel === 'devicemap-panel' }" x-show="activePanel === 'devicemap-panel'" x-data="devicemapPanel()" x-init="load()" x-on:beforeunload.window="confirmUnsavedUnload($event)">
  <h2>
    {{t "devicemap.title"}}
    <span class="field-help field-help-align-start">
      <button class="field-help-trigger" type="button" aria-label="{{t "devicemap.help_button_aria"}}">
        <svg><use href="#ico-help"></use></svg>
      </button>
      <span class="field-help-text" role="tooltip">{{t "devicemap.help_text"}}</span>
    </span>
  </h2>
  <div class="devicemap-stage">
    <div id="devicemap-canvas" class="devicemap-canvas" x-ref="canvas" aria-label="{{t "devicemap.canvas_aria"}}"></div>
    <div class="devicemap-labels" x-ref="labels" aria-hidden="true"></div>
    <div class="devicemap-overlay">
      <div class="toolbar devicemap-toolbar">
        <button class="icon-button primary" id="devicemap-save" type="button" x-on:click="save()" x-bind:disabled="saving || loading" x-bind:title="saveButtonLabel()" x-bind:aria-label="saveButtonLabel()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 4h13l3 3v13H4z"/><path d="M8 4v5h6V4"/><rect x="8" y="14" width="8" height="6"/></svg>
        </button>
        <button class="icon-button" id="devicemap-discard" type="button" x-cloak x-show="unsaved" x-on:click="discardChanges()" x-bind:disabled="saving || loading" x-bind:title="$t('devicemap.discard_button')" x-bind:aria-label="$t('devicemap.discard_button')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
        <button class="icon-button" id="devicemap-connect-toggle" type="button" x-bind:class="{ active: connectMode }" x-bind:aria-pressed="connectMode" x-on:click="toggleConnectMode()" x-bind:disabled="loading" x-bind:title="connectMode ? $t('devicemap.connect_mode.on') : $t('devicemap.connect_mode.off')" x-bind:aria-label="connectMode ? $t('devicemap.connect_mode.on') : $t('devicemap.connect_mode.off')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        </button>
        <button class="icon-button" id="devicemap-snap-toggle" type="button" x-bind:class="{ active: view.snap_to_grid }" x-bind:aria-pressed="view.snap_to_grid" x-on:click="toggleSnapToGrid()" x-bind:disabled="loading" x-bind:title="view.snap_to_grid ? $t('devicemap.snap_to_grid.on') : $t('devicemap.snap_to_grid.off')" x-bind:aria-label="view.snap_to_grid ? $t('devicemap.snap_to_grid.on') : $t('devicemap.snap_to_grid.off')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 12h16"/><path d="M12 4v16"/><circle cx="12" cy="12" r="2.3" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="icon-button" id="devicemap-grid-toggle" type="button" x-bind:class="{ active: view.show_grid }" x-bind:aria-pressed="view.show_grid" x-on:click="toggleShowGrid()" x-bind:disabled="loading" x-bind:title="view.show_grid ? $t('devicemap.show_grid.on') : $t('devicemap.show_grid.off')" x-bind:aria-label="view.show_grid ? $t('devicemap.show_grid.on') : $t('devicemap.show_grid.off')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </button>
        <div class="devicemap-edge-style-group" role="group" x-bind:aria-label="$t('devicemap.edge_style_group_aria')">
          <button class="icon-button" type="button" x-bind:class="{ active: view.edge_style === 'straight' }" x-bind:aria-pressed="view.edge_style === 'straight'" x-on:click="setEdgeStyle('straight')" x-bind:title="$t('devicemap.edge_style.straight')" x-bind:aria-label="$t('devicemap.edge_style.straight')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 19L19 5"/></svg>
          </button>
          <button class="icon-button" type="button" x-bind:class="{ active: view.edge_style === 'elbow' }" x-bind:aria-pressed="view.edge_style === 'elbow'" x-on:click="setEdgeStyle('elbow')" x-bind:title="$t('devicemap.edge_style.elbow')" x-bind:aria-label="$t('devicemap.edge_style.elbow')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 19h9v-9h5"/></svg>
          </button>
          <button class="icon-button" type="button" x-bind:class="{ active: view.edge_style === 'curved' }" x-bind:aria-pressed="view.edge_style === 'curved'" x-on:click="setEdgeStyle('curved')" x-bind:title="$t('devicemap.edge_style.curved')" x-bind:aria-label="$t('devicemap.edge_style.curved')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 19C5 10 10 5 19 5"/></svg>
          </button>
        </div>
        <span class="devicemap-unsaved-badge" role="status" x-cloak x-show="unsaved">{{t "devicemap.unsaved_badge"}}</span>
      </div>
      <p class="devicemap-connect-hint" x-cloak x-show="connectMode" x-text="connectHintText()"></p>
      <p class="devicemap-placed-hint" x-cloak x-show="placedCount > 0" x-text="placedHintText()"></p>
      <div class="toolbar devicemap-edge-toolbar" x-cloak x-show="selectedEdge">
        <span class="devicemap-edge-label" x-text="selectedEdgeLabel"></span>
        <button class="icon-button danger" type="button" x-show="selectedEdge && selectedEdge.overrideId" x-on:click="removeSelectedRelation()" x-bind:title="$t('devicemap.disconnect_button')" x-bind:aria-label="$t('devicemap.disconnect_button')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
        </button>
        <span class="devicemap-edge-readonly-hint" x-cloak x-show="selectedEdge && !selectedEdge.overrideId">{{t "devicemap.edge_readonly_hint"}}</span>
        <button class="icon-button" type="button" x-on:click="clearEdgeSelection()" x-bind:title="$t('devicemap.clear_selection_button')" x-bind:aria-label="$t('devicemap.clear_selection_button')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
        </button>
      </div>
    </div>
  </div>
  {{template "revisions" .}}
</section>
{{end}}
