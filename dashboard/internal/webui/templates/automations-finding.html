{{define "automations-finding"}}
              <template x-if="findingFor({{.key}}.id)">
                <button class="auto-learn-mark" type="button" aria-haspopup="dialog" {{if eq .tour "rule"}}data-tour="rule-finding-mark"{{end}}
                        x-bind:class="'is-' + findingFor({{.key}}.id)?.severity + (findingOpen === findingFor({{.key}}.id)?.id ? ' is-open' : '')"
                        x-bind:aria-expanded="findingOpen === findingFor({{.key}}.id)?.id ? 'true' : 'false'"
                        x-on:click.stop="toggleFinding({{.key}}.id, $el)"
                        aria-label="{{t "automations.learn.mark_label"}}">
                  <svg class="automation-icon" aria-hidden="true"><use x-bind:href="findingFor({{.key}}.id)?.severity === 'info' ? '#ico-info' : '#ico-warning'"></use></svg>
                </button>
              </template>
              <template x-teleport="body">
                <div class="auto-learn-layer">
                  <template x-for="finding in [findingFor({{.key}}.id)].filter((entry) => entry && entry.id === findingOpen)" x-bind:key="finding.id">
                    <div class="auto-learn-pop" role="dialog" aria-modal="false" x-transition:leave="auto-learn-pop-leave" x-transition:leave-end="auto-learn-pop-out" x-ref="findingPop"{{if eq .tour "rule"}}data-tour="rule-finding-pop"{{end}}
                         x-bind:aria-label="findingText(finding).title" x-bind:style="findingStyle"
                         x-on:click.outside="closeFinding()" x-on:keydown.escape.window="closeFinding()">
                      <div class="auto-learn-pop-head">
                        <svg class="automation-icon" aria-hidden="true" x-bind:class="'is-' + finding.severity"><use x-bind:href="finding.severity === 'info' ? '#ico-info' : '#ico-warning'"></use></svg>
                        <h4 x-text="findingText(finding).title"></h4>
                        <button class="auto-learn-pop-close" type="button" aria-label="{{t "automations.learn.close"}}" x-on:click="closeFinding()">
                          <svg class="automation-icon" aria-hidden="true"><use href="#ico-close"></use></svg>
                        </button>
                      </div>
                      <p class="auto-learn-pop-text" x-text="findingText(finding).text"></p>
                      <div class="auto-learn-evidence" x-effect="window.AutomationEvidence.mount($el, finding.evidence, $t)"></div>
                      <div class="auto-learn-pop-actions" x-show="canEditAutomations">
                        <template x-for="(fix, index) in (finding.apply || [])" x-bind:key="index">
                          <button class="auto-btn-text auto-learn-fix" type="button" x-bind:class="{ 'is-primary': index === 0 }" {{if eq .tour "rule"}}x-bind:data-tour="index === 0 ? 'rule-finding-fix' : null"{{end}}
                                  x-on:click="applyFix(fix, finding)" x-text="fixLabel(fix)"></button>
                        </template>
                        <button class="auto-btn-text is-ghost auto-learn-ignore" type="button" x-on:click="ignoreFinding(finding)">{{t "automations.learn.ignore"}}</button>
                      </div>
                    </div>
                  </template>
                </div>
              </template>
{{end}}
