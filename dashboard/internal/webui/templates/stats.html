{{define "stats"}}
<div class="stats-page" x-data="statsPanel()" x-init="init()">
  <h2>{{t "energy_stats.title"}}</h2>
  <div class="stats-toolbar">
    <div class="stats-periods" role="group" aria-label="{{t "energy_stats.period.label"}}">
      <button type="button" class="stats-chip" x-bind:class="{active: period === 'day'}" x-bind:aria-pressed="period === 'day'" x-on:click="selectPeriod('day')">{{t "energy_stats.period.day"}}</button>
      <button type="button" class="stats-chip" x-bind:class="{active: period === 'week'}" x-bind:aria-pressed="period === 'week'" x-on:click="selectPeriod('week')">{{t "energy_stats.period.week"}}</button>
      <button type="button" class="stats-chip" x-bind:class="{active: period === 'month'}" x-bind:aria-pressed="period === 'month'" x-on:click="selectPeriod('month')">{{t "energy_stats.period.month"}}</button>
      <button type="button" class="stats-chip" x-bind:class="{active: period === 'year'}" x-bind:aria-pressed="period === 'year'" x-on:click="selectPeriod('year')">{{t "energy_stats.period.year"}}</button>
    </div>
    <div class="stats-nav">
      <button type="button" class="stats-nav-btn" x-on:click="prev()" x-bind:disabled="!hasPrev || loading">{{t "energy_stats.prev"}}</button>
      <strong class="stats-title" x-text="title"></strong>
      <button type="button" class="stats-nav-btn" x-on:click="next()" x-bind:disabled="!hasNext || loading">{{t "energy_stats.next"}}</button>
    </div>
  </div>
  <p class="stats-error" role="alert" x-show="error" x-text="error"></p>
  <dl class="stats-kpis">
    <template x-for="kpi in kpis" x-bind:key="kpi.id">
      <div class="stats-kpi"><dt x-text="kpi.label"></dt><dd x-text="kpi.value"></dd></div>
    </template>
  </dl>
  <p class="stats-coverage" role="status" x-text="coverage"></p>
  <div class="stats-chart" role="img" aria-label="{{t "energy_stats.chart.label"}}" x-ref="chart"></div>
  <p class="stats-empty" x-show="empty">{{t "energy_stats.empty"}}</p>
  <div class="stats-table-wrap" x-show="rows.length">
    <table class="stats-table">
      <thead>
        <tr>
          <th scope="col">{{t "energy_stats.table.role"}}</th>
          <template x-for="(label, index) in labels" x-bind:key="index"><th scope="col" x-text="label"></th></template>
          <th scope="col">{{t "energy_stats.table.total"}}</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="row in rows" x-bind:key="row.role">
          <tr>
            <th scope="row"><span class="stats-swatch" aria-hidden="true" x-bind:style="`background:${row.color}`"></span><span x-text="row.label"></span></th>
            <template x-for="(value, index) in row.values" x-bind:key="index"><td x-text="value"></td></template>
            <td class="stats-table-total" x-text="row.total"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
{{end}}
