{{define "whatsnew"}}
<section id="settings-whatsnew" role="tabpanel" class="settings-cards whatsnew-cards" x-show="activeSettingsPage === 'whatsnew'" x-data="whatsNewPanel()" x-effect="if (activeSettingsPage === 'whatsnew') ensureLoaded()">
  <div class="setting-card whatsnew-hero">
    <span class="whatsnew-eyebrow">{{t "settings.whatsnew.eyebrow"}}</span>
    <h3 class="setting-card-title" x-text="title"></h3>
    <p class="setting-note" x-show="sincePrevious">{{t "settings.whatsnew.since"}} <span class="version-tag" x-text="from"></span> → <strong class="version-tag" x-text="to"></strong></p>
    <p class="settings-help" x-show="error" x-text="error"></p>
    <p class="setting-note" x-show="!loading && !error && components.length === 0">{{t "settings.whatsnew.empty"}}</p>
    <template x-for="component in components" :key="component.id">
      <section class="whatsnew-component">
        <h4 class="whatsnew-component-title"><span x-text="component.label"></span> <span class="version-chip" x-text="component.from ? component.from + ' → ' + component.to : component.to"></span></h4>
        <ul class="release-entries">
          <template x-for="release in component.releases" :key="release.version">
            <template x-for="(entry, index) in release.entries" :key="release.version + '-' + index">
              <li x-bind:class="{ 'is-breaking': entry.breaking }"><span class="release-breaking" x-show="entry.breaking">{{t "settings.versions.breaking"}}</span> <span x-text="entryText(entry)"></span></li>
            </template>
          </template>
        </ul>
      </section>
    </template>
    <div class="toolbar">
      <button type="button" class="icon-button labeled" x-on:click="showAll()">{{t "settings.whatsnew.all_changes"}}</button>
      <a class="icon-button labeled" x-bind:href="overviewHref()">{{t "settings.whatsnew.overview"}}</a>
    </div>
  </div>
</section>
{{end}}
