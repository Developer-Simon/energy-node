{{define "config"}}
<section id="config-panel" class="panel config-panel" role="tabpanel" aria-labelledby="tab-config" x-bind:class="{ active: activePanel === 'config-panel' }" x-show="activePanel === 'config-panel'" x-data="configPanel()" x-init="load(); initActionBar()">
  <h2>{{t "config.title"}}</h2>
  <!-- Zaehler und Dienststatus teilen sich eine Zeile. Die Revision steht
       nicht hier, sondern im Revisionsbereich, wo man sie vergleicht. -->
  <div class="config-meta">
    <span id="config-count" x-text="configCount"></span>
    <span id="config-runtime-status" class="config-status" role="status" aria-live="polite" x-cloak x-show="runtimeState" x-bind:data-state="runtimeState" x-bind:aria-label="$t('config.runtime_status.label', {state: runtimeStateLabel})">
      <span class="config-status-dot" aria-hidden="true"></span>
      <span class="config-status-text" x-text="runtimeStateLabel"></span>
    </span>
  </div>
  <div id="config-presets-error" class="message error" role="alert" x-cloak x-show="presetsError" x-text="presetsError"></div>
  <div id="config-reload-error" class="message error" role="alert" x-cloak x-show="reloadFailed">
    <strong>{{t "config.reload_failed.title"}}</strong>
    <span>{{t "config.reload_failed.description"}}</span>
    <code x-text="reloadError"></code>
    <button type="button" x-on:click="reloadService()" x-bind:disabled="reloading" x-text="reloading ? $t('config.reload_failed.retry_loading') : $t('config.reload_failed.retry')"></button>
  </div>
  <template x-if="runtimeState === 'rejected'">
    <div id="config-runtime-error" class="message error config-runtime-error" role="alert">
      <p>{{t "config.runtime_error.description"}}</p>
      <code x-show="runtimeErrorText" x-text="runtimeErrorText"></code>
      <button type="button" x-on:click="openRevisions()">{{t "config.runtime_error.open_revisions"}}</button>
    </div>
  </template>
  <form id="schema-form" class="schema-form" novalidate x-ref="schemaForm" x-on:submit.prevent="saveForm()" x-on:input="formDirty = true" x-on:change="formDirty = true"></form>

  <!-- Der Rohtext-Editor ist der seltenere Weg und liegt deshalb eine Ebene
       tiefer; sein Speichern-Button steht bei ihm drin statt in der
       schwebenden Leiste, damit dort genau eine primaere Aktion bleibt. -->
  <details id="config-json" class="config-json">
    <summary class="config-json-summary">
      <span class="config-json-summary-label">{{t "config.editor.label"}}</span>
      <span class="config-json-dirty" x-cloak x-show="editorDirty">{{t "config.editor.dirty"}}</span>
    </summary>
    <div class="config-json-body">
      <p class="config-json-note">{{t "config.editor.note"}}</p>
      <textarea id="config-editor" aria-label="{{t "config.editor.aria_label"}}" x-model="editorText"></textarea>
      <div class="config-json-actions">
        <button id="config-editor-reset" type="button" x-on:click="resetEditor()" x-bind:disabled="!editorDirty">{{t "config.editor.reset"}}</button>
        <button class="primary" id="config-save" type="button" x-on:click="saveEditor()" x-bind:disabled="saving || loading">{{t "config.editor.save"}}</button>
      </div>
    </div>
  </details>

  <template x-if="selectedName">
    {{template "revisions" .}}
  </template>

  <!-- Schwebende Aktionsleiste: liegt als letztes Element im Fluss und klebt
       per position:sticky ueber dem Inhalt, solange der Sentinel darunter
       nicht sichtbar ist. Sie loest sich damit beim Scrollen aus der Seite
       (.is-floating) und dockt am Seitenende wieder an. -->
  <div class="config-actionbar-dock" x-bind:class="{ 'is-floating': actionsFloating }">
    <div class="config-actionbar" x-bind:class="{ 'is-compact': actionsCompact }" x-on:click="expandActions()" x-on:focusin="expandActions()">
      <span class="config-actionbar-lead">
        <select id="config-name" aria-label="{{t "config.service.aria_label"}}" x-model="selectedName" x-on:change="loadConfig()"><template x-for="config in configs" x-bind:key="config.name"><option x-bind:value="config.name" x-text="config.label_key ? $t(config.label_key) : config.label"></option></template></select>
        <button id="config-load" type="button" x-on:click="loadConfig()" x-bind:disabled="loading || reloading">{{t "config.load"}}</button>
        <span class="config-actionbar-divider" aria-hidden="true"></span>
      </span>
      <span class="config-actionbar-status" x-bind:class="{ 'is-dirty': formDirty, 'is-note': !formDirty && editorDirty }">
        <span class="config-actionbar-dot" aria-hidden="true"></span>
        <span class="config-actionbar-text" x-text="actionStatusText" aria-live="polite"></span>
      </span>
      <button id="config-form-reset" type="button" class="config-actionbar-secondary" x-on:click="resetForm()" x-bind:disabled="loading || saving">{{t "config.reset"}}</button>
      <button class="primary" id="config-form-save" type="submit" form="schema-form" x-bind:disabled="saving || loading" x-text="saving ? $t('common.save_loading') : $t('common.save')">{{t "common.save"}}</button>
    </div>
  </div>
  <div class="config-actionbar-sentinel" x-ref="actionSentinel" aria-hidden="true"></div>
</section>
{{end}}
