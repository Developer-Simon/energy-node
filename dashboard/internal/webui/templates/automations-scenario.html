{{define "automations-scenario"}}
<div class="auto-scenario-head">
  <span class="auto-scenario-name" x-show="!scenarioEditing[scenario.id]" x-text="scenario.name"></span>
  <input type="text" class="auto-scenario-name" x-show="scenarioEditing[scenario.id]" x-model="scenario.name"
         x-bind:aria-label="$t('automations.scenario.name_input.aria_label')">
  <span class="automation-unsaved-badge" x-cloak x-show="newIds[scenario.id]">{{t "automations.scenario.new_badge"}}</span>

  <label class="settings-toggle"
         x-bind:title="scenario.enabled ? $t('automations.scenario.enabled_toggle.title_on') : $t('automations.scenario.enabled_toggle.title_off')">
    <input type="checkbox" x-model="scenario.enabled"
           x-bind:aria-label="$t('automations.scenario.enabled_toggle.aria_label', {name: scenario.name})">
    <span class="settings-toggle-track"><span class="settings-toggle-thumb"></span></span>
  </label>

  <button class="icon-button" x-bind:class="{ active: scenarioEditing[scenario.id] }" type="button"
          x-on:click="scenarioEditing[scenario.id] = !scenarioEditing[scenario.id]"
          x-bind:title="scenarioEditing[scenario.id] ? $t('automations.scenario.edit_button.tooltip_stop') : $t('automations.scenario.edit_button.tooltip_edit')"
          x-bind:aria-label="scenarioEditing[scenario.id] ? $t('automations.scenario.edit_button.tooltip_stop') : $t('automations.scenario.edit_button.tooltip_edit')">
    <svg class="automation-icon"><use x-bind:href="scenarioEditing[scenario.id] ? '#ico-check' : '#ico-pencil'"></use></svg>
  </button>
  <button class="icon-button danger" type="button" x-on:click="removeScenario(scenario.id)"
          x-bind:title="$t('automations.scenario.delete_button.tooltip', {name: scenario.name})" x-bind:aria-label="$t('automations.scenario.delete_button.tooltip', {name: scenario.name})">
    <svg class="automation-icon"><use href="#ico-trash"></use></svg>
  </button>
</div>
{{end}}
