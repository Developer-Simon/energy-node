{{define "automations-scenario"}}
<template x-if="!scenarioExpanded[scenario.id]">
  <div class="auto-scenario-row" role="button" tabindex="0"
       x-bind:aria-expanded="'false'"
       x-on:click="toggleScenarioExpanded(scenario)"
       x-on:keydown.enter.prevent="toggleScenarioExpanded(scenario)"
       x-on:keydown.space.prevent="toggleScenarioExpanded(scenario)">
    <span class="auto-tile"><svg class="automation-icon"><use x-bind:href="'#' + scenarioIcon(scenario)"></use></svg></span>
    <span class="auto-scenario-text">
      <span class="auto-scenario-name" x-text="scenario.name"></span>
      <span class="auto-pill" x-show="showHistory" x-bind:class="scenarioStatus(scenario).tone" x-text="scenarioStatus(scenario).label"></span>
      <span class="auto-sub" x-show="scenarioStatus(scenario).detail" x-text="scenarioStatus(scenario).detail"></span>
    </span>
    <template x-if="scenarioProgress(scenario)">
      <div class="auto-progress" role="img"
           x-bind:aria-label="$t('automations.scenario.progress.aria_label')"
           x-bind:title="scenarioProgress(scenario).label">
        <i x-bind:style="'width: ' + scenarioProgress(scenario).percent + '%'"></i>
      </div>
    </template>
    <template x-if="scenario.while && scenario.while.mode === 'regulate' && !scenarioProgress(scenario)">
      <div class="auto-mini-figures" x-show="!showHistory" x-bind:class="{ 'is-consumer': regulatorFigures(scenario).direction === 'consumer' }">
        <span class="auto-mini-figure">
          <small>{{t "automations.scenario.figures.net_label"}}</small>
          <b class="is-grid"><span x-text="gridNowText(scenario)"></span><span x-show="gridNowText(scenario) !== '—'"> W</span></b>
        </span>
        <span class="auto-mini-figure">
          <small>{{t "automations.scenario.figures.output_label"}}</small>
          <b class="is-output"><span x-text="regulatorFigures(scenario).output"></span><span x-show="regulatorFigures(scenario).output !== '—'"> W</span></b>
        </span>
      </div>
    </template>
    <template x-if="showHistory && scenario.while && scenario.while.mode === 'regulate' && !scenarioProgress(scenario)">
      <div class="auto-spark-row">
        <svg class="auto-spark" viewBox="0 0 150 34" aria-hidden="true">
          <rect class="auto-spark-band" x="0" width="150" x-bind:y="sparklineFor(scenario).band.y" x-bind:height="sparklineFor(scenario).band.height"></rect>
          <path class="auto-spark-line" fill="none" stroke-width="2" x-bind:d="sparklineFor(scenario).path"></path>
        </svg>
        <span class="auto-mini-figure">
          <small>{{t "automations.scenario.figures.output_label"}}</small>
          <b class="is-output"><span x-text="regulatorFigures(scenario).output"></span><span x-show="regulatorFigures(scenario).output !== '—'"> W</span></b>
        </span>
      </div>
    </template>
    <span class="auto-pill" x-show="!showHistory" x-bind:class="scenarioStatus(scenario).tone" x-text="scenarioStatus(scenario).label"></span>
    <label class="settings-toggle" x-on:click.stop x-on:keydown.stop x-show="canEditAutomations || canOperateAutomations"
           x-bind:title="scenario.enabled ? $t('automations.scenario.enabled_toggle.title_on') : $t('automations.scenario.enabled_toggle.title_off')">
      <input type="checkbox" x-model="scenario.enabled"
             x-bind:aria-label="$t('automations.scenario.enabled_toggle.aria_label', {name: scenario.name})">
      <span class="settings-toggle-track"><span class="settings-toggle-thumb"></span></span>
    </label>
  </div>
</template>

<template x-if="scenarioExpanded[scenario.id]">
  <div class="auto-scenario-open">
    <div class="auto-scenario-head">
      <button class="auto-tile is-accent auto-collapse" type="button" x-on:click="toggleScenarioExpanded(scenario)"
              x-bind:aria-expanded="'true'"
              x-bind:title="$t('automations.scenario.collapse_button.tooltip', {name: scenario.name})"
              x-bind:aria-label="$t('automations.scenario.collapse_button.tooltip', {name: scenario.name})">
        <svg class="automation-icon"><use x-bind:href="'#' + scenarioIcon(scenario)"></use></svg>
      </button>
      <span class="auto-scenario-name is-clickable" x-show="!scenarioEditing[scenario.id]" x-text="scenario.name"
            x-on:click="toggleScenarioExpanded(scenario)"></span>
      <input type="text" class="auto-scenario-name" x-show="scenarioEditing[scenario.id]" x-model="scenario.name"
             x-bind:aria-label="$t('automations.scenario.name_input.aria_label')">
      <span class="auto-pill" x-bind:class="scenarioStatus(scenario).tone" x-text="scenarioStatus(scenario).label"></span>
      <span class="automation-unsaved-badge" x-cloak x-show="newIds[scenario.id]">{{t "automations.scenario.new_badge"}}</span>

      <label class="settings-toggle" x-show="canEditAutomations || canOperateAutomations"
             x-bind:title="scenario.enabled ? $t('automations.scenario.enabled_toggle.title_on') : $t('automations.scenario.enabled_toggle.title_off')">
        <input type="checkbox" x-model="scenario.enabled"
               x-bind:aria-label="$t('automations.scenario.enabled_toggle.aria_label', {name: scenario.name})">
        <span class="settings-toggle-track"><span class="settings-toggle-thumb"></span></span>
      </label>

      <button class="icon-button auto-btn-ghost" x-show="canEditAutomations" x-bind:class="{ active: scenarioEditing[scenario.id] }" type="button"
              x-on:click="scenarioEditing[scenario.id] = !scenarioEditing[scenario.id]"
              x-bind:title="scenarioEditing[scenario.id] ? $t('automations.scenario.edit_button.tooltip_stop') : $t('automations.scenario.edit_button.tooltip_edit')"
              x-bind:aria-label="scenarioEditing[scenario.id] ? $t('automations.scenario.edit_button.tooltip_stop') : $t('automations.scenario.edit_button.tooltip_edit')">
        <svg class="automation-icon"><use x-bind:href="scenarioEditing[scenario.id] ? '#ico-check' : '#ico-pencil'"></use></svg>
      </button>
      <button class="icon-button danger auto-btn-ghost" x-show="canEditAutomations" type="button" x-on:click="removeScenario(scenario.id)"
              x-bind:title="$t('automations.scenario.delete_button.tooltip', {name: scenario.name})" x-bind:aria-label="$t('automations.scenario.delete_button.tooltip', {name: scenario.name})">
        <svg class="automation-icon"><use href="#ico-trash"></use></svg>
      </button>
    </div>
    <fieldset class="auto-readonly-scope" x-bind:disabled="!canEditAutomations">

    <template x-if="scenario.while && scenario.while.mode === 'regulate'">
      <div class="auto-regulator" x-bind:class="{ 'is-consumer': regulatorFigures(scenario).direction === 'consumer' }">
        <div class="auto-figures">
          <div class="auto-figure">
            <span class="auto-figure-label"><svg class="automation-icon automation-icon-sm"><use href="#ico-grid"></use></svg>{{t "automations.scenario.figures.net_label"}}</span>
            <span class="auto-figure-value is-grid"><span x-text="gridNowText(scenario)"></span><small x-show="gridNowText(scenario) !== '—'"> W</small></span>
            <span class="auto-figure-hint" x-text="$t('automations.scenario.figures.net_hint', {target: regulatorFigures(scenario).target, band: regulatorFigures(scenario).band})"></span>
          </div>
          <div class="auto-figure">
            <span class="auto-figure-label"><svg class="automation-icon automation-icon-sm"><use x-bind:href="'#' + scenarioIcon(scenario)"></use></svg>{{t "automations.scenario.figures.output_label"}}</span>
            <span class="auto-figure-value is-output"><span x-text="regulatorFigures(scenario).output"></span><small x-show="regulatorFigures(scenario).output !== '—'"> W</small></span>
            <span class="auto-figure-hint" x-text="$t('automations.scenario.figures.output_hint', {min: regulatorFigures(scenario).min, max: regulatorFigures(scenario).max})"></span>
          </div>
          <div class="auto-figure">
            <span class="auto-figure-label"><svg class="automation-icon automation-icon-sm"><use href="#ico-history"></use></svg>{{t "automations.scenario.figures.today_label"}}</span>
            <span class="auto-figure-value"><span x-text="todayExportText()"></span><small x-show="todayExportText() !== '—'"> kWh</small></span>
            <span class="auto-figure-hint">{{t "automations.scenario.figures.today_hint"}}</span>
          </div>
        </div>

        <figure class="auto-chart">
          <div class="auto-plot" x-show="!chartFor(scenario).empty">
            <svg class="auto-plot-svg" viewBox="0 0 600 170" preserveAspectRatio="none" role="img"
                 x-bind:aria-label="$t('automations.scenario.chart.aria_label')">
              <rect class="auto-chart-band" x="0" width="600" x-bind:y="chartFor(scenario).band.y" x-bind:height="chartFor(scenario).band.height"></rect>
              <path class="auto-chart-output" x-bind:d="chartFor(scenario).outputPath"></path>
              <path class="auto-chart-grid" x-bind:d="chartFor(scenario).gridPath"></path>
            </svg>
            <template x-for="tick in chartFor(scenario).yTicks" x-bind:key="tick.label">
              <span class="auto-chart-tick" x-bind:style="'top: ' + tick.y + 'px'" x-text="tick.label"></span>
            </template>
            <template x-for="marker in chartFor(scenario).markers" x-bind:key="marker.x + marker.kind">
              <span class="auto-chart-marker" x-bind:style="'left: ' + (marker.x / 600 * 100) + '%'" x-text="marker.label"></span>
            </template>
          </div>
          <p class="auto-chart-empty" x-show="chartFor(scenario).empty" x-text="$t('automations.scenario.chart.empty')"></p>
          <figcaption class="auto-chart-legend">
            <span><i class="auto-swatch is-grid"></i>{{t "automations.scenario.chart.legend_grid"}}</span>
            <span><i class="auto-swatch is-output"></i>{{t "automations.scenario.chart.legend_output"}}</span>
            <span><i class="auto-swatch is-band"></i>{{t "automations.scenario.chart.legend_band"}}</span>
            <span class="auto-range" role="group" aria-label="{{t "automations.scenario.chart.range_label"}}">
              <button type="button" x-bind:aria-pressed="scenarioRange(scenario.id) === '30m' ? 'true' : 'false'" x-on:click="setChartRange(scenario, '30m')">{{t "automations.scenario.chart.range.30m"}}</button>
              <button type="button" x-bind:aria-pressed="scenarioRange(scenario.id) === '6h' ? 'true' : 'false'" x-on:click="setChartRange(scenario, '6h')">{{t "automations.scenario.chart.range.6h"}}</button>
              <button type="button" x-bind:aria-pressed="scenarioRange(scenario.id) === 'today' ? 'true' : 'false'" x-on:click="setChartRange(scenario, 'today')">{{t "automations.scenario.chart.range.today"}}</button>
            </span>
          </figcaption>
        </figure>
      </div>
    </template>

    <template x-if="!scenarioEditing[scenario.id]">
      <div class="auto-phases">
        <template x-for="(phase, index) in scenarioPhases(scenario)" x-bind:key="phase.phase">
          <div class="auto-phase" x-bind:class="{ 'is-active': activePhaseIndex(scenario) === index }">
            <span class="auto-phase-head"><svg class="automation-icon automation-icon-sm"><use x-bind:href="'#' + phase.icon"></use></svg><span class="auto-phase-cap" x-text="phase.label"></span></span>
            <b x-text="phase.title"></b>
            <span class="auto-phase-text" x-text="phase.text"></span>
          </div>
        </template>
      </div>
    </template>

    <template x-if="scenarioEditing[scenario.id]">
      <div class="auto-scenario-edit">
        <section class="auto-block">
          <h4 class="auto-block-cap">{{t "automations.scenario.phase.name.start"}}</h4>
          <div x-data="scenarioRows(scenario, 'when', 'when')"><div class="auto-edit-list">{{template "automations-condition-editors"}}</div>
{{template "automations-condition-tiles"}}</div>
          <div x-data="scenarioRows(scenario, 'on_start', null)"><div class="auto-edit-list">{{template "automations-action-editors"}}</div>
{{template "automations-action-tiles"}}</div>
        </section>

        <section class="auto-block">
          <h4 class="auto-block-cap">{{t "automations.scenario.phase.name.while"}}</h4>
          <div class="auto-flow-row">
            <span class="auto-flow-label">{{t "automations.scenario.edit.while.aria"}}</span>
            <div class="auto-segment" role="radiogroup" x-bind:aria-label="$t('automations.scenario.edit.while.aria')">
              <button class="auto-segment-tab" type="button" role="radio" x-on:click="changeWhileMode(scenario, 'regulate')"
                      x-bind:aria-checked="scenario.while.mode === 'regulate' ? 'true' : 'false'"><span class="auto-compare-glyph" aria-hidden="true">~</span><span>{{t "automations.scenario.edit.while.regulate"}}</span></button>
              <button class="auto-segment-tab" type="button" role="radio" x-on:click="changeWhileMode(scenario, 'hold')"
                      x-bind:aria-checked="scenario.while.mode === 'hold' ? 'true' : 'false'"><svg class="automation-icon automation-icon-sm" aria-hidden="true"><use href="#ico-gate"></use></svg><span>{{t "automations.scenario.edit.while.hold"}}</span></button>
              <button class="auto-segment-tab" type="button" role="radio" x-on:click="changeWhileMode(scenario, 'none')"
                      x-bind:aria-checked="scenario.while.mode === 'none' ? 'true' : 'false'"><svg class="automation-icon automation-icon-sm" aria-hidden="true"><use href="#ico-close"></use></svg><span>{{t "automations.scenario.edit.while.none"}}</span></button>
            </div>
          </div>

          <template x-if="scenario.while.mode === 'regulate' && scenario.while.regulator">
            <div class="auto-regulator-edit">
              <div class="auto-fields">
                <div class="auto-field" x-data="{ get stepTarget() { return scenario.while.regulator }, stepKey: 'target_w', stepOpts: { min: -50000, max: 50000, step: 10 }, stepUnit: 'W', stepLabel: $t('automations.scenario.edit.regulator.target_label') }">
                  <span class="auto-field-head">
                    <span class="auto-field-label">{{t "automations.scenario.edit.regulator.target_label"}}</span>
                    <span class="field-help">
                      <button class="field-help-trigger" type="button" x-bind:aria-label="$t('automations.scenario.edit.help_aria', {label: $t('automations.scenario.edit.regulator.target_label')})">
                        <svg><use href="#ico-help"></use></svg>
                      </button>
                      <span class="field-help-text" role="tooltip" x-text="fieldHelp('target_w')"></span>
                    </span>
                  </span>
                  {{template "auto-stepper"}}
                </div>
                <div class="auto-field" x-data="{ get stepTarget() { return scenario.while.regulator }, stepKey: 'deadband_w', stepOpts: { min: 0, max: 5000, step: 10, fallback: 20 }, stepUnit: 'W', stepLabel: $t('automations.scenario.edit.regulator.deadband_label') }">
                  <span class="auto-field-head">
                    <span class="auto-field-label">{{t "automations.scenario.edit.regulator.deadband_label"}}</span>
                    <span class="field-help">
                      <button class="field-help-trigger" type="button" x-bind:aria-label="$t('automations.scenario.edit.help_aria', {label: $t('automations.scenario.edit.regulator.deadband_label')})">
                        <svg><use href="#ico-help"></use></svg>
                      </button>
                      <span class="field-help-text" role="tooltip" x-text="fieldHelp('deadband_w')"></span>
                    </span>
                  </span>
                  {{template "auto-stepper"}}
                </div>
              </div>
              <div class="auto-edit-grid">
                <div class="auto-band auto-field-wide">
                  <svg class="auto-band-svg" role="img" viewBox="0 0 100 20" preserveAspectRatio="none"
                       x-bind:aria-label="bandPreviewFor(scenario).inside === null ? $t('automations.scenario.edit.band.unknown') : $t(bandPreviewFor(scenario).inside ? 'automations.scenario.edit.band.inside' : 'automations.scenario.edit.band.outside', {net: gridNowText(scenario)})">
                    <rect class="auto-band-zone" x-bind:x="bandPreviewFor(scenario).zone.left" y="0" height="20" x-bind:width="bandPreviewFor(scenario).zone.width"></rect>
                    <rect class="auto-band-target" x-bind:x="bandPreviewFor(scenario).target - 0.3" y="0" height="20" width="0.6"></rect>
                    <rect class="auto-band-now" x-show="bandPreviewFor(scenario).now !== null" x-bind:x="(bandPreviewFor(scenario).now ?? 0) - 0.6" y="0" height="20" width="1.2"></rect>
                  </svg>
                  <p class="auto-band-line" x-show="bandPreviewFor(scenario).inside !== null"
                     x-text="$t(bandPreviewFor(scenario).inside ? 'automations.scenario.edit.band.inside' : 'automations.scenario.edit.band.outside', {net: gridNowText(scenario)})"></p>
                </div>
                <div class="auto-field auto-field-wide">
                  <span class="auto-field-label">{{t "automations.scenario.edit.regulator.direction_label"}}</span>
                  <div class="auto-segment" role="radiogroup" x-bind:aria-label="$t('automations.scenario.edit.regulator.direction_label')">
                    <button class="auto-segment-tab" type="button" role="radio" x-on:click="setRegulatorDirection(scenario, 'producer')"
                            x-bind:aria-checked="scenario.while.regulator.direction !== 'consumer' ? 'true' : 'false'">{{t "automations.scenario.edit.regulator.direction_producer"}}</button>
                    <button class="auto-segment-tab" type="button" role="radio" x-on:click="setRegulatorDirection(scenario, 'consumer')"
                            x-bind:aria-checked="scenario.while.regulator.direction === 'consumer' ? 'true' : 'false'">{{t "automations.scenario.edit.regulator.direction_consumer"}}</button>
                  </div>
                </div>
                <div class="auto-field auto-field-wide">
                  <span class="auto-field-label">{{t "automations.scenario.edit.regulator.output_label"}}</span>
                  <div class="auto-device-chips" role="group" x-bind:aria-label="$t('automations.scenario.edit.regulator.output_label')">
                    <div class="auto-device-row">
                    <template x-for="chip in actuatorChips(scenario).chips" x-bind:key="chip.id || 'unknown'">
                      <button type="button" class="auto-device-chip"
                              x-bind:class="{ 'is-selected': !chip.unknown && chip.id === (regulatorOf(scenario).output || {}).entity_id, 'is-unknown': chip.unknown, 'is-dim': !chip.fits }"
                              x-bind:aria-pressed="!chip.unknown && chip.id === (regulatorOf(scenario).output || {}).entity_id ? 'true' : 'false'"
                              x-on:click="chip.unknown ? chooseActuator(scenario) : setRegulatorOutput(scenario, chip.id)">
                        <span class="auto-tile-icon" x-bind:class="chip.tone ? 'is-tone-' + chip.tone : ''"><svg class="automation-icon"><use x-bind:href="'#' + chip.icon"></use></svg></span>
                        {{template "auto-chip-text" "chip"}}
                      </button>
                    </template>
                    <p class="auto-device-hint" x-show="actuatorChips(scenario).hint" x-text="actuatorChips(scenario).hint"></p>
                    </div>
                    <button type="button" class="auto-device-more" x-on:click="chooseActuator(scenario)"
                            x-text="$t('automations.devices.show_all', {n: actuatorChips(scenario).more})"></button>
                  </div>
                </div>
                <div class="auto-field auto-field-wide">
                  <span class="auto-field-label">{{t "automations.scenario.edit.regulator.base_label"}}</span>
                  <div class="auto-segment" role="radiogroup" x-bind:aria-label="$t('automations.scenario.edit.regulator.base_label')">
                    <button class="auto-segment-tab" type="button" role="radio" x-on:click="setRegulatorBase(scenario, 'entity', (readableEntities[0] || {}).unique_id)"
                            x-bind:aria-checked="(scenario.while.regulator.base || {}).source === 'entity' ? 'true' : 'false'">{{t "automations.scenario.edit.regulator.base_entity"}}</button>
                    <button class="auto-segment-tab" type="button" role="radio" x-on:click="setRegulatorBase(scenario, 'balance')"
                            x-bind:aria-checked="(scenario.while.regulator.base || {}).source === 'balance' ? 'true' : 'false'">{{t "automations.scenario.edit.regulator.base_balance"}}</button>
                    <button class="auto-segment-tab" type="button" role="radio" x-on:click="setRegulatorBase(scenario, 'last')"
                            x-bind:aria-checked="(scenario.while.regulator.base || {}).source === 'last' ? 'true' : 'false'">{{t "automations.scenario.edit.regulator.base_last"}}</button>
                  </div>
                  <template x-if="(scenario.while.regulator.base || {}).source === 'entity'">
                    <div class="auto-device-chips" role="group" x-bind:aria-label="$t('automations.scenario.edit.regulator.base_entity_label')">
                      <div class="auto-device-row">
                      <template x-for="chip in meterChips(scenario).chips" x-bind:key="chip.id || 'unknown'">
                        <button type="button" class="auto-device-chip"
                                x-bind:class="{ 'is-selected': !chip.unknown && chip.id === ((scenario.while.regulator.base || {}).entity_id), 'is-unknown': chip.unknown }"
                                x-bind:aria-pressed="!chip.unknown && chip.id === ((scenario.while.regulator.base || {}).entity_id) ? 'true' : 'false'"
                                x-on:click="chip.unknown ? chooseMeter(scenario) : setRegulatorBase(scenario, 'entity', chip.id)">
                          <span class="auto-tile-icon" x-bind:class="chip.tone ? 'is-tone-' + chip.tone : ''"><svg class="automation-icon"><use x-bind:href="'#' + chip.icon"></use></svg></span>
                          {{template "auto-chip-text" "chip"}}
                        </button>
                      </template>
                      </div>
                      <button type="button" class="auto-device-more" x-on:click="chooseMeter(scenario)"
                              x-text="$t('automations.devices.show_all', {n: meterChips(scenario).more})"></button>
                    </div>
                  </template>
                </div>
              </div>

              <div class="auto-card" x-data="{ advancedOpen: false }">
                <button type="button" class="auto-card-head auto-card-toggle" x-on:click="advancedOpen = !advancedOpen" x-bind:aria-expanded="advancedOpen ? 'true' : 'false'">
                  <span class="auto-tile-icon"><svg class="automation-icon"><use href="#ico-gear"></use></svg></span>
                  <span class="auto-card-title">{{t "automations.scenario.edit.advanced"}}</span>
                  <svg class="automation-icon rule-expand-chevron" x-bind:class="{ expanded: advancedOpen }" aria-hidden="true"><use href="#ico-chevron"></use></svg>
                </button>
                <div class="automation-collapse" x-cloak x-show="advancedOpen" x-collapse>
                  <p class="auto-card-hint">{{t "automations.scenario.edit.defaults_hint"}}</p>
                  <div class="auto-fields">
                    <div class="auto-field" x-data="{ get stepTarget() { return scenario.while.regulator }, stepKey: 'gain', stepOpts: { fallback: 0.8, min: 0.1, max: 1, step: 0.1 }, stepUnit: '', stepLabel: $t('automations.scenario.edit.regulator.gain_label') }">
                      <span class="auto-field-head">
                        <span class="auto-field-label">{{t "automations.scenario.edit.regulator.gain_label"}}</span>
                        <span class="field-help">
                          <button class="field-help-trigger" type="button" x-bind:aria-label="$t('automations.scenario.edit.help_aria', {label: $t('automations.scenario.edit.regulator.gain_label')})">
                            <svg><use href="#ico-help"></use></svg>
                          </button>
                          <span class="field-help-text" role="tooltip" x-text="fieldHelp('gain')"></span>
                        </span>
                      </span>
                      {{template "auto-stepper"}}
                    </div>
                    <div class="auto-field" x-data="{ get stepTarget() { return scenario.while.regulator }, stepKey: 'interval_s', get stepOpts() { return { min: 5, max: 3600, step: 1, fallback: document.settings.regulator_interval_s } }, stepUnit: $t('automations.condition.unit_seconds'), stepLabel: $t('automations.scenario.edit.regulator.interval_label') }">
                      <span class="auto-field-head">
                        <span class="auto-field-label">{{t "automations.scenario.edit.regulator.interval_label"}}</span>
                        <span class="field-help">
                          <button class="field-help-trigger" type="button" x-bind:aria-label="$t('automations.scenario.edit.help_aria', {label: $t('automations.scenario.edit.regulator.interval_label')})">
                            <svg><use href="#ico-help"></use></svg>
                          </button>
                          <span class="field-help-text" role="tooltip" x-text="fieldHelp('interval_s')"></span>
                        </span>
                      </span>
                      {{template "auto-stepper"}}
                    </div>
                    <div class="auto-field" x-data="{ get stepTarget() { return scenario.while.regulator.output }, stepKey: 'step', get stepOpts() { const d = regulatorStepDefault(scenario); return { fallback: d, min: d, step: d } }, stepUnit: 'W', stepLabel: $t('automations.scenario.edit.regulator.step_label') }">
                      <span class="auto-field-label">{{t "automations.scenario.edit.regulator.step_label"}}</span>
                      {{template "auto-stepper"}}
                    </div>
                    <div class="auto-field" x-data="{ get stepTarget() { return scenario.while.regulator }, stepKey: 'max_change_w', stepOpts: { min: 10, step: 10, placeholder: $t('automations.scenario.edit.regulator.max_change_free') }, stepUnit: 'W', stepLabel: $t('automations.scenario.edit.regulator.max_change_label') }">
                      <span class="auto-field-head">
                        <span class="auto-field-label">{{t "automations.scenario.edit.regulator.max_change_label"}}</span>
                        <span class="field-help">
                          <button class="field-help-trigger" type="button" x-bind:aria-label="$t('automations.scenario.edit.help_aria', {label: $t('automations.scenario.edit.regulator.max_change_label')})">
                            <svg><use href="#ico-help"></use></svg>
                          </button>
                          <span class="field-help-text" role="tooltip" x-text="fieldHelp('max_change_w')"></span>
                        </span>
                      </span>
                      {{template "auto-stepper"}}
                    </div>
                    <div class="auto-field">
                      <label class="auto-field-label" x-bind:for="`scn-${scenario.id}-min`">{{t "automations.scenario.edit.regulator.min_label"}}</label>
                      <span class="auto-input-field">
                        <input class="auto-input" x-bind:id="`scn-${scenario.id}-min`" type="number" x-model.number="scenario.while.regulator.output.min">
                        <span class="auto-input-unit">W</span>
                      </span>
                    </div>
                    <div class="auto-field">
                      <label class="auto-field-label" x-bind:for="`scn-${scenario.id}-max`">{{t "automations.scenario.edit.regulator.max_label"}}</label>
                      <span class="auto-input-field">
                        <input class="auto-input" x-bind:id="`scn-${scenario.id}-max`" type="number" x-model.number="scenario.while.regulator.output.max">
                        <span class="auto-input-unit">W</span>
                      </span>
                    </div>
                    <div class="auto-field">
                      <span class="auto-field-head">
                        <label class="auto-field-label" x-bind:for="`scn-${scenario.id}-fallback`">{{t "automations.scenario.edit.regulator.fallback_label"}}</label>
                        <span class="field-help">
                          <button class="field-help-trigger" type="button" x-bind:aria-label="$t('automations.scenario.edit.help_aria', {label: $t('automations.scenario.edit.regulator.fallback_label')})">
                            <svg><use href="#ico-help"></use></svg>
                          </button>
                          <span class="field-help-text" role="tooltip" x-text="fieldHelp('fallback')"></span>
                        </span>
                      </span>
                      <span class="auto-input-field">
                        <input class="auto-input" x-bind:id="`scn-${scenario.id}-fallback`" type="text"
                               x-bind:value="(scenario.while.regulator.fallback || {}).payload || ''"
                               x-on:input="scenario.while.regulator.fallback = { payload: $event.target.value }">
                        <span class="auto-input-unit">W</span>
                      </span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </template>

          <template x-if="scenario.while.mode === 'hold'">
            <div class="auto-regulator-edit">
              <div x-data="scenarioRows(scenario, 'while', null)"><div class="auto-edit-list">{{template "automations-action-editors"}}</div>
{{template "automations-action-tiles"}}</div>
              <div class="auto-flow-row">
                <label class="auto-flow-label" x-bind:for="`scn-${scenario.id}-hold-repeat`">{{t "automations.rule_editor.repeat_label"}}</label>
                <input x-bind:id="`scn-${scenario.id}-hold-repeat`" type="number" min="0" max="86400" x-model.number="scenario.while.repeat_seconds">
                <span class="field-help">
                  <button class="field-help-trigger" type="button" x-bind:aria-label="$t('automations.rule_editor.repeat_help_aria_label')">
                    <svg><use href="#ico-help"></use></svg>
                  </button>
                  <span class="field-help-text" role="tooltip" x-text="fieldHelp('repeat_seconds')"></span>
                </span>
              </div>
            </div>
          </template>
        </section>

        <section class="auto-block">
          <h4 class="auto-block-cap">{{t "automations.scenario.phase.name.end"}}</h4>
          <div class="auto-flow-row">
            <label class="settings-toggle">
              <input type="checkbox" x-bind:checked="Boolean(scenario.until)" x-on:change="toggleUntil(scenario, $event.target.checked)"
                     x-bind:aria-label="$t('automations.scenario.edit.until.switch')">
              <span class="settings-toggle-track"><span class="settings-toggle-thumb"></span></span>
            </label>
            <span class="auto-flow-label">{{t "automations.scenario.edit.until.switch"}}</span>
          </div>
          <template x-if="scenario.until">
            <div x-data="scenarioRows(scenario, 'until', 'until')"><div class="auto-edit-list">{{template "automations-condition-editors"}}</div>
{{template "automations-condition-tiles"}}</div>
          </template>
          <template x-if="!scenario.until">
            <p class="auto-hint">{{t "automations.scenario.end_when_false"}}</p>
          </template>
          <div class="auto-fields">
          <div class="auto-field" x-data="{ get stepTarget() { return { get v() { return maxDurationMinutes(scenario) }, set v(x) { setMaxDurationMinutes(scenario, x) } } }, stepKey: 'v', stepOpts: { min: 1, max: 1440, step: 1 }, stepUnit: 'min', stepLabel: $t('automations.scenario.edit.max_duration.label') }">
            <span class="auto-field-head">
              <span class="auto-field-label">{{t "automations.scenario.edit.max_duration.label"}}</span>
              <span class="field-help">
                <button class="field-help-trigger" type="button" x-bind:aria-label="$t('automations.scenario.edit.help_aria', {label: $t('automations.scenario.edit.max_duration.label')})">
                  <svg><use href="#ico-help"></use></svg>
                </button>
                <span class="field-help-text" role="tooltip" x-text="fieldHelp('max_duration_s')"></span>
              </span>
            </span>
            {{template "auto-stepper"}}
          </div>
          <div class="auto-field" x-data="{ get stepTarget() { return { get v() { return minRunMinutes(scenario) }, set v(x) { setMinRunMinutes(scenario, x) } } }, stepKey: 'v', stepOpts: { min: 0, max: 1440, step: 1, fallback: 0 }, stepUnit: 'min', stepLabel: $t('automations.scenario.edit.min_run.label') }">
            <span class="auto-field-head">
              <span class="auto-field-label">{{t "automations.scenario.edit.min_run.label"}}</span>
              <span class="field-help">
                <button class="field-help-trigger" type="button" x-bind:aria-label="$t('automations.scenario.edit.help_aria', {label: $t('automations.scenario.edit.min_run.label')})">
                  <svg><use href="#ico-help"></use></svg>
                </button>
                <span class="field-help-text" role="tooltip" x-text="fieldHelp('min_run_s')"></span>
              </span>
            </span>
            {{template "auto-stepper"}}
          </div>
          <div class="auto-field" x-data="{ get stepTarget() { return { get v() { return cooldownMinutes(scenario) }, set v(x) { setCooldownMinutes(scenario, x) } } }, stepKey: 'v', stepOpts: { min: 0, max: 1440, step: 1, fallback: 0 }, stepUnit: 'min', stepLabel: $t('automations.scenario.edit.cooldown.label') }">
            <span class="auto-field-head">
              <span class="auto-field-label">{{t "automations.scenario.edit.cooldown.label"}}</span>
              <span class="field-help">
                <button class="field-help-trigger" type="button" x-bind:aria-label="$t('automations.scenario.edit.help_aria', {label: $t('automations.scenario.edit.cooldown.label')})">
                  <svg><use href="#ico-help"></use></svg>
                </button>
                <span class="field-help-text" role="tooltip" x-text="fieldHelp('cooldown_s')"></span>
              </span>
            </span>
            {{template "auto-stepper"}}
          </div>
          </div>
          <div x-data="scenarioRows(scenario, 'on_end', null)"><div class="auto-edit-list">{{template "automations-action-editors"}}</div>
{{template "automations-action-tiles"}}</div>
        </section>

        <div class="auto-edit-foot">
          <label class="settings-toggle">
            <input type="checkbox" x-model="scenario.history_enabled"
                   x-bind:aria-label="$t('automations.scenario.edit.history.enabled_aria_label', {name: scenario.name})">
            <span class="settings-toggle-track"><span class="settings-toggle-thumb"></span></span>
          </label>
          <span class="auto-flow-label">{{t "automations.scenario.edit.history.label"}}</span>
          <span class="field-help">
            <button class="field-help-trigger" type="button" x-bind:aria-label="$t('automations.scenario.edit.help_aria', {label: $t('automations.scenario.edit.history.label')})">
              <svg><use href="#ico-help"></use></svg>
            </button>
            <span class="field-help-text" role="tooltip" x-text="fieldHelp('history_enabled')"></span>
          </span>
        </div>
      </div>
    </template>
    </fieldset>
  </div>
</template>
{{end}}
