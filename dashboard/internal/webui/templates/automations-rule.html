{{define "automations-rule"}}
            <div class="automation-rule-head">
              <button class="icon-button" type="button" x-on:click="toggleExpanded(rule)"
                      x-bind:aria-expanded="Boolean(expanded[rule.id])"
                      x-bind:title="expanded[rule.id] ? $t('automations.rule.expand_button.tooltip_collapse') : $t('automations.rule.expand_button.tooltip_expand')"
                      x-bind:aria-label="expanded[rule.id] ? $t('automations.rule.expand_button.tooltip_collapse') : $t('automations.rule.expand_button.tooltip_expand')">
                <svg class="automation-icon rule-expand-chevron" x-bind:class="{ expanded: expanded[rule.id] }"><use href="#ico-chevron"></use></svg>
              </button>
              <span class="auto-tile is-accent"><svg class="automation-icon"><use x-bind:href="'#' + ruleIcon(rule)"></use></svg></span>

              <span class="automation-rule-name" x-show="!editing[rule.id]" x-text="rule.name"></span>
              <input type="text" x-model="rule.name" x-show="editing[rule.id]" class="automation-rule-name"
                     x-bind:aria-label="$t('automations.rule.name_input.aria_label')">
              <span class="auto-pill" x-bind:class="gateVerdict(rule).tone" x-bind:title="gateVerdict(rule).detail" x-text="gateVerdict(rule).label"></span>
              <span class="automation-unsaved-badge" role="status" x-cloak x-show="isDirty(rule)">{{t "automations.rule.unsaved_badge"}}</span>

              <label class="settings-toggle"
                     x-bind:title="rule.enabled ? $t('automations.rule.enabled_toggle.title_on') : $t('automations.rule.enabled_toggle.title_off')">
                <input type="checkbox" x-bind:checked="rule.enabled" x-on:change="toggleEnabled(rule.id)"
                       x-bind:aria-label="$t('automations.rule.enabled_toggle.aria_label', {name: rule.name})">
                <span class="settings-toggle-track"><span class="settings-toggle-thumb"></span></span>
              </label>

              <button class="icon-button" x-bind:class="{ active: editing[rule.id] }" type="button"
                      x-on:click="editing[rule.id] ? stopEditing(rule) : startEditing(rule)"
                      x-bind:title="editing[rule.id] ? $t('automations.rule.edit_button.tooltip_stop') : $t('automations.rule.edit_button.tooltip_edit')"
                      x-bind:aria-label="editing[rule.id] ? $t('automations.rule.edit_button.tooltip_stop') : $t('automations.rule.edit_button.tooltip_edit')">
                <svg class="automation-icon"><use x-bind:href="editing[rule.id] ? '#ico-check' : '#ico-pencil'"></use></svg>
              </button>
              <button class="icon-button danger" type="button" x-on:click="removeRule(rule.id)"
                      x-bind:title="$t('automations.rule.delete_button.tooltip', {name: rule.name})" x-bind:aria-label="$t('automations.rule.delete_button.tooltip', {name: rule.name})">
                <svg class="automation-icon"><use href="#ico-trash"></use></svg>
              </button>
            </div>

            <div class="auto-rule-body" x-show="expanded[rule.id]">

              <template x-if="!editing[rule.id]">
                <div class="auto-rule-view">
                  <template x-if="liveBar(rule)">
                    <div class="auto-live">
                      <div class="auto-live-head">
                        <span class="auto-figure-label">{{t "automations.rule.live.label"}}</span>
                        <span class="auto-live-value" x-text="liveBar(rule).valueText"></span>
                      </div>
                      <div class="auto-live-bar" role="img" x-bind:aria-label="$t('automations.rule.live.aria_label')">
                        <i class="auto-live-fill" x-bind:style="{ width: (liveBar(rule).fraction * 100) + '%' }"></i>
                        <template x-if="liveBar(rule).band">
                          <i class="auto-live-band" x-bind:style="{ left: (liveBar(rule).band.left * 100) + '%', width: (liveBar(rule).band.width * 100) + '%' }"></i>
                        </template>
                        <i class="auto-live-mark" x-bind:style="{ left: (liveBar(rule).mark * 100) + '%' }"></i>
                      </div>
                    </div>
                  </template>

                  <div class="auto-blocks">
                    <section class="auto-block">
                      <h4 class="auto-block-cap">{{t "automations.rule.block.when"}}</h4>
                      <ul class="auto-lines">
                        {{template "automations-condition-lines"}}
                      </ul>
                    </section>

                    <section class="auto-block">
                      <h4 class="auto-block-cap">{{t "automations.rule.block.then"}}</h4>
                      <ul class="auto-lines">
                        {{template "automations-action-lines"}}
                      </ul>
                    </section>

                    <section class="auto-block">
                      <h4 class="auto-block-cap">{{t "automations.rule.block.flow"}}</h4>
                      <ul class="auto-lines">
                        <li class="auto-line">
                          <svg class="automation-icon"><use href="#ico-history"></use></svg>
                          <span class="auto-line-text" x-text="rule.repeat_seconds > 0 ? $t('automations.rule.flow.repeat', {seconds: rule.repeat_seconds}) : $t('automations.rule.flow.once')"></span>
                        </li>
                        <li class="auto-line">
                          <svg class="automation-icon"><use href="#ico-gate"></use></svg>
                          <span class="auto-line-text" x-text="$t('automations.rule.flow.cooldown', {seconds: rule.cooldown_seconds || 0})"></span>
                        </li>
                      </ul>
                    </section>
                  </div>

                  <template x-if="rule.history_enabled">
                    <div class="auto-rule-timeline">
                      <span class="auto-block-cap">{{t "automations.rule.timeline.caption"}}</span>
                      <div class="auto-timeline-track">
                        <template x-for="(mark, index) in ruleTimeline(rule)" x-bind:key="index">
                          <i class="auto-timeline-mark" x-bind:class="mark.tone" x-bind:style="{ left: (mark.x / 6) + '%' }"></i>
                        </template>
                      </div>
                      <div class="auto-timeline-axis">
                        <span>{{t "automations.rule.timeline.six_hours_ago"}}</span>
                        <span>{{t "automations.rule.timeline.three_hours_ago"}}</span>
                        <span>{{t "automations.rule.timeline.now"}}</span>
                      </div>
                    </div>
                  </template>
                  <template x-if="!rule.history_enabled">
                    <p class="sub">{{t "automations.history.disabled_message"}}</p>
                  </template>
                </div>
              </template>

              <template x-if="editing[rule.id]">
                <div class="auto-rule-edit">
                  <p class="message error" x-show="validateRuleBeforeSave(rule).length" x-text="validateRuleBeforeSave(rule).join(' / ')"></p>

                  <section class="auto-block">
                    <h4 class="auto-block-cap">{{t "automations.rule.block.when"}}</h4>
                    <div class="auto-edit-list">
                      {{template "automations-condition-editors"}}
                    </div>
                    <button class="icon-button labeled" type="button" x-show="!showCondTiles" x-on:click="showCondTiles = true"
                            x-bind:title="$t('automations.rule.add_condition')" x-bind:aria-label="$t('automations.rule.add_condition')">
                      <svg class="automation-icon"><use href="#ico-plus"></use></svg><span>{{t "automations.rule.add_condition"}}</span>
                    </button>
                    <div class="type-tiles" role="group" x-show="showCondTiles" x-bind:aria-label="$t('automations.condition.add_button_aria')">
                      <template x-for="type in conditionTypes()" x-bind:key="type.key">
                        <button class="type-tile" type="button" x-on:click="addCondition(rule, type.key); showCondTiles = false"
                                x-bind:title="type.hint" x-bind:aria-label="$t('automations.condition.add_aria', {type: type.label})">
                          <svg class="automation-icon"><use x-bind:href="'#' + type.icon"></use></svg>
                          <span class="type-tile-label" x-text="type.label"></span>
                        </button>
                      </template>
                    </div>
                  </section>

                  <section class="auto-block">
                    <h4 class="auto-block-cap">{{t "automations.rule.block.then"}}</h4>
                    <div class="auto-edit-list">
                      {{template "automations-action-editors"}}
                    </div>
                    <button class="icon-button labeled" type="button" x-show="!showActTiles" x-on:click="showActTiles = true"
                            x-bind:title="$t('automations.rule.add_action')" x-bind:aria-label="$t('automations.rule.add_action')">
                      <svg class="automation-icon"><use href="#ico-plus"></use></svg><span>{{t "automations.rule.add_action"}}</span>
                    </button>
                    <div class="type-tiles" role="group" x-show="showActTiles" x-bind:aria-label="$t('automations.action.add_button_aria')">
                      <template x-for="type in actionTypes()" x-bind:key="type.key">
                        <button class="type-tile" type="button"
                                x-show="!type.advanced && (type.key !== 'entity' || entities.length)"
                                x-on:click="addAction(rule, type.key, $data); showActTiles = false"
                                x-bind:title="type.hint" x-bind:aria-label="$t('automations.action.add_aria', {type: type.label})">
                          <svg class="automation-icon"><use x-bind:href="'#' + type.icon"></use></svg>
                          <span class="type-tile-label" x-text="type.label"></span>
                        </button>
                      </template>
                    </div>

                    <div class="edit-advanced" x-data="{ advancedOpen: false }">
                      <button type="button" class="edit-advanced-toggle" x-on:click="advancedOpen = !advancedOpen" x-bind:aria-expanded="advancedOpen ? 'true' : 'false'">
                        <svg class="automation-icon rule-expand-chevron" x-bind:class="{ expanded: advancedOpen }" aria-hidden="true"><use href="#ico-chevron"></use></svg>
                        <span>{{t "automations.action.advanced"}}</span>
                      </button>
                      <div class="automation-collapse" x-cloak x-show="advancedOpen" x-collapse>
                        <div class="type-tiles">
                          <template x-for="type in actionTypes()" x-bind:key="type.key">
                            <button class="type-tile" type="button" x-show="type.advanced"
                                    x-on:click="addAction(rule, type.key, $data)"
                                    x-bind:title="type.hint" x-bind:aria-label="$t('automations.action.add_aria', {type: type.label})">
                              <svg class="automation-icon"><use x-bind:href="'#' + type.icon"></use></svg>
                              <span class="type-tile-label" x-text="type.label"></span>
                            </button>
                          </template>
                        </div>
                      </div>
                    </div>

                    <div class="edit-card entity-wizard" x-cloak x-show="entities.length && showEntityWizard">
                  <div class="edit-card-head">
                    <svg class="automation-icon"><use href="#ico-switch"></use></svg>
                    <span class="edit-card-title">{{t "automations.wizard.entity.title"}}</span>
                    <button class="icon-button" type="button" x-on:click="showEntityWizard = false"
                            x-bind:title="$t('automations.wizard.entity.close_title')" x-bind:aria-label="$t('automations.wizard.entity.close_title')">
                      <svg class="automation-icon"><use href="#ico-chevron"></use></svg>
                    </button>
                  </div>

                  <div class="entity-wizard-row">
                    <label for="wizard-entity">{{t "automations.wizard.entity.device_label"}}</label>
                    <select id="wizard-entity" x-model="newEntityId">
                      <option value="">{{t "automations.wizard.entity.device_select"}}</option>
                      <template x-for="[deviceName, group] in commandableEntityGroups()" x-bind:key="deviceName">
                        <optgroup x-bind:label="deviceName">
                          <template x-for="entity in group" x-bind:key="entity.unique_id">
                            <option x-bind:value="entity.unique_id" x-text="entity.name || entity.unique_id"></option>
                          </template>
                        </optgroup>
                      </template>
                    </select>
                  </div>

                  <div class="entity-wizard-row" x-show="newEntityId">
                    <button class="icon-button labeled" type="button" x-bind:title="$t('automations.wizard.entity.on_title')" x-bind:aria-label="$t('automations.wizard.entity.on_title')"
                            x-on:click="rule.actions.push(buildSwitchAction(entityByUniqueId(newEntityId), 'on')); showEntityWizard = false">
                      <svg class="automation-icon"><use href="#ico-power-on"></use></svg><span>{{t "automations.wizard.entity.on_label"}}</span>
                    </button>
                    <button class="icon-button labeled" type="button" x-bind:title="$t('automations.wizard.entity.off_title')" x-bind:aria-label="$t('automations.wizard.entity.off_title')"
                            x-on:click="rule.actions.push(buildSwitchAction(entityByUniqueId(newEntityId), 'off')); showEntityWizard = false">
                      <svg class="automation-icon"><use href="#ico-power-off"></use></svg><span>{{t "automations.wizard.entity.off_label"}}</span>
                    </button>
                    <button class="icon-button labeled" type="button" x-bind:title="$t('automations.wizard.entity.toggle_title')" x-bind:aria-label="$t('automations.wizard.entity.toggle_title')"
                            x-show="entityByUniqueId(newEntityId) && entityByUniqueId(newEntityId).payload_on && entityByUniqueId(newEntityId).payload_off"
                            x-on:click="rule.actions.push(buildToggleAction(entityByUniqueId(newEntityId))); showEntityWizard = false">
                      <svg class="automation-icon"><use href="#ico-switch"></use></svg><span>{{t "automations.wizard.entity.toggle_label"}}</span>
                    </button>
                  </div>

                  <div class="edit-advanced" x-data="{ advancedOpen: false }" x-show="newEntityId">
                    <button type="button" class="edit-advanced-toggle" x-on:click="advancedOpen = !advancedOpen" x-bind:aria-expanded="advancedOpen ? 'true' : 'false'">
                      <svg class="automation-icon rule-expand-chevron" x-bind:class="{ expanded: advancedOpen }" aria-hidden="true"><use href="#ico-chevron"></use></svg>
                      <span>{{t "automations.wizard.setpoint.summary"}}</span>
                    </button>
                    <div class="automation-collapse" x-cloak x-show="advancedOpen" x-collapse>
                      <div class="entity-wizard-row" style="padding-top: .6rem;">
                        <label>{{t "automations.wizard.setpoint.source_label"}}
                          <select x-model="newMode">
                            <option value="constant">{{t "automations.wizard.setpoint.constant"}}</option><option value="balance">{{t "automations.wizard.setpoint.balance"}}</option>
                          </select>
                        </label>
                        <template x-if="newMode === 'constant'">
                          <input type="number" x-model.number="newConstantValue" x-bind:placeholder="$t('automations.wizard.setpoint.value_placeholder')" x-bind:aria-label="$t('automations.wizard.setpoint.value_aria')">
                        </template>
                        <template x-if="newMode === 'balance'">
                          <span class="entity-wizard-row">
                            <select x-model="newField" x-bind:aria-label="$t('automations.wizard.setpoint.field_aria')">
                              <template x-for="[field, label] in balanceFields" x-bind:key="field">
                                <option x-bind:value="field" x-text="label"></option>
                              </template>
                              <template x-if="customBalanceFields.length">
                                <optgroup x-bind:label="$t('automations.metric.custom_group')">
                                  <template x-for="[field, label] in customBalanceFields" x-bind:key="field">
                                    <option x-bind:value="field" x-text="label"></option>
                                  </template>
                                </optgroup>
                              </template>
                            </select>
                            <span class="edit-field-label">
                              {{t "automations.wizard.setpoint.scale_label"}}
                              <span class="field-help">
                                <button class="field-help-trigger" type="button" x-bind:aria-label="$t('automations.wizard.setpoint.scale_explain_aria')">
                                  <svg><use href="#ico-help"></use></svg>
                                </button>
                                <span class="field-help-text" role="tooltip" x-text="fieldHelp('scale')"></span>
                              </span>
                            </span>
                            <input type="number" x-model.number="newScale" style="width: 4.5rem;" x-bind:aria-label="$t('automations.wizard.setpoint.scale_label')">
                            <span class="edit-field-label">
                              {{t "automations.wizard.setpoint.offset_label"}}
                              <span class="field-help">
                                <button class="field-help-trigger" type="button" x-bind:aria-label="$t('automations.wizard.setpoint.offset_explain_aria')">
                                  <svg><use href="#ico-help"></use></svg>
                                </button>
                                <span class="field-help-text" role="tooltip" x-text="fieldHelp('offset')"></span>
                              </span>
                            </span>
                            <input type="number" x-model.number="newOffset" style="width: 4.5rem;" x-bind:aria-label="$t('automations.wizard.setpoint.offset_label')">
                          </span>
                        </template>
                        <button class="icon-button labeled accent" type="button"
                                x-bind:title="$t('automations.wizard.setpoint.add_title')" x-bind:aria-label="$t('automations.wizard.setpoint.add_aria')"
                                x-on:click="rule.actions.push(buildSetpointAction(entityByUniqueId(newEntityId), { mode: newMode, field: newField, scale: newScale, offset: newOffset, value: newConstantValue })); showEntityWizard = false">
                          <svg class="automation-icon"><use href="#ico-plus"></use></svg><span>{{t "automations.wizard.setpoint.add_button"}}</span>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
                  </section>

                  <section class="auto-block">
                    <h4 class="auto-block-cap">{{t "automations.rule.block.flow"}}</h4>
                    <div class="auto-flow-row">
                      <span class="auto-flow-label">{{t "automations.rule.flow.mode_label"}}</span>
                      <div class="auto-segment" role="radiogroup" x-bind:aria-label="$t('automations.rule.flow.mode_label')">
                        <button class="auto-segment-tab" type="button" role="radio" x-on:click="setRepeatMode(rule, 'once')"
                                x-bind:aria-checked="rule.repeat_seconds != null ? 'false' : 'true'">{{t "automations.rule.flow.once_segment"}}</button>
                        <button class="auto-segment-tab" type="button" role="radio" x-on:click="setRepeatMode(rule, 'repeat')"
                                x-bind:disabled="hasToggleAction(rule)"
                                x-bind:aria-checked="rule.repeat_seconds != null ? 'true' : 'false'">{{t "automations.rule.flow.repeat_segment"}}</button>
                      </div>
                      <template x-if="rule.repeat_seconds != null">
                        <span class="auto-flow-row">
                          <span>{{t "automations.rule.flow.every"}}</span>
                          <input x-bind:id="`repeat-${rule.id}`" type="number" min="0" max="86400" x-model.number="rule.repeat_seconds"
                                 x-bind:aria-label="$t('automations.rule_editor.repeat_label')">
                          <span class="edit-unit">s</span>
                          <span class="field-help">
                            <button class="field-help-trigger" type="button" x-bind:aria-label="$t('automations.rule_editor.repeat_help_aria_label')">
                              <svg><use href="#ico-help"></use></svg>
                            </button>
                            <span class="field-help-text" role="tooltip" x-text="fieldHelp('repeat_seconds')"></span>
                          </span>
                        </span>
                      </template>
                    </div>
                    <p class="auto-hint" x-show="hasToggleAction(rule)">{{t "automations.rule_editor.repeat_blocked_toggle"}}</p>
                    <div class="auto-flow-row">
                      <label class="auto-flow-label" x-bind:for="`cooldown-${rule.id}`">
                        {{t "automations.rule_editor.cooldown_label"}}
                        <span class="field-help">
                          <button class="field-help-trigger" type="button" x-bind:aria-label="$t('automations.rule_editor.cooldown_help_aria_label')">
                            <svg><use href="#ico-help"></use></svg>
                          </button>
                          <span class="field-help-text" role="tooltip" x-text="fieldHelp('cooldown_seconds')"></span>
                        </span>
                      </label>
                      <input x-bind:id="`cooldown-${rule.id}`" type="number" min="0" max="86400" x-model.number="rule.cooldown_seconds">
                    </div>
                  </section>
                </div>
              </template>

            </div>

            <div class="history" x-show="expanded[rule.id]">
              <div class="history-head">
                <button type="button" class="history-toggle" x-on:click="toggleHistory(rule)"
                        x-text="historyExpanded[rule.id] ? $t('automations.history.toggle_hide') : $t('automations.history.toggle_show')"></button>
                <label class="settings-toggle"
                       x-bind:title="rule.history_enabled ? $t('automations.history.enabled_title') : $t('automations.history.disabled_title')">
                  <input x-bind:id="`history-enabled-${rule.id}`" type="checkbox" role="switch"
                         x-model="rule.history_enabled" x-bind:aria-checked="rule.history_enabled"
                         x-bind:aria-label="$t('automations.history.enabled_aria_label', {name: rule.name})">
                  <span class="settings-toggle-track" aria-hidden="true"><span class="settings-toggle-thumb"></span></span>
                </label>
                <span class="field-help">
                  <button class="field-help-trigger" type="button" x-bind:aria-label="$t('automations.history.explanation_button.aria_label')">
                    <svg><use href="#ico-help"></use></svg>
                  </button>
                  <span class="field-help-text" role="tooltip" x-text="fieldHelp('history_enabled')"></span>
                </span>
              </div>
              <template x-if="historyExpanded[rule.id]">
                <div>
                  <template x-if="!rule.history_enabled">
                    <p class="sub">{{t "automations.history.disabled_message"}}</p>
                  </template>
                  <template x-if="rule.history_enabled && historyEntries(rule).length === 0">
                    <p class="sub">{{t "automations.history.no_entries"}}</p>
                  </template>
                  <ul class="history-list" x-show="rule.history_enabled">
                    <template x-for="event in historyEntries(rule)" x-bind:key="event.at">
                      <li class="history-entry" x-bind:class="historyResultInfo(event.result).tone">
                        <span class="history-time" x-text="historyTimestamp(event)"></span>
                        <span class="history-badge" x-text="historyResultInfo(event.result).label"></span>
                        <span class="history-test" x-show="event.test">{{t "automations.history.test_badge"}}</span>
                        <ul class="history-actions">
                          <template x-for="(action, index) in event.actions" x-bind:key="index">
                            <li x-text="historyActionText(action)"></li>
                          </template>
                        </ul>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>
            </div>
{{end}}
