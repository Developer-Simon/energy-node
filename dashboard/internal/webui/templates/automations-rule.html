{{define "automations-rule"}}
            <div class="automation-rule-head" x-bind:class="{ 'is-collapsed': !expanded[rule.id], 'is-editing': editing[rule.id] }" x-on:click="expanded[rule.id] || toggleExpanded(rule)">
              <button class="auto-tile is-accent auto-collapse" type="button" x-on:click.stop="toggleExpanded(rule)"
                      x-bind:aria-expanded="Boolean(expanded[rule.id])"
                      x-bind:title="expanded[rule.id] ? $t('automations.rule.expand_button.tooltip_collapse') : $t('automations.rule.expand_button.tooltip_expand')"
                      x-bind:aria-label="expanded[rule.id] ? $t('automations.rule.expand_button.tooltip_collapse') : $t('automations.rule.expand_button.tooltip_expand')">
                <svg class="automation-icon"><use x-bind:href="'#' + ruleIcon(rule)"></use></svg>
              </button>

              <span class="auto-rule-main">
                <span class="automation-rule-name is-clickable" x-show="!editing[rule.id]" x-text="rule.name"></span>
                <input type="text" x-model="rule.name" x-show="editing[rule.id]" class="automation-rule-name"
                       x-bind:aria-label="$t('automations.rule.name_input.aria_label')">
                <span class="auto-rule-preview" aria-hidden="true" x-show="!expanded[rule.id]">
                  <template x-for="(entry, index) in rulePreview(rule).conditions" x-bind:key="'c' + index">
                    <svg class="automation-icon automation-icon-sm" x-bind:class="entry.state"><use x-bind:href="'#' + entry.icon"></use></svg>
                  </template>
                  <svg class="automation-icon automation-icon-sm auto-rule-preview-arrow"><use href="#ico-chevron"></use></svg>
                  <template x-for="(entry, index) in rulePreview(rule).actions" x-bind:key="'a' + index">
                    <svg class="automation-icon automation-icon-sm"><use x-bind:href="'#' + entry.icon"></use></svg>
                  </template>
                </span>
                <span class="auto-pill" x-bind:class="gateVerdict(rule).tone" x-bind:title="gateVerdict(rule).detail" x-text="gateVerdict(rule).label"></span>
                <span class="automation-unsaved-badge" role="status" x-cloak x-show="isDirty(rule)">{{t "automations.rule.unsaved_badge"}}</span>
                <span class="auto-rule-short" x-show="!expanded[rule.id]" x-bind:class="'is-' + ruleShortStatus(rule).tone">
                  <i class="auto-dot" aria-hidden="true"></i>
                  <span x-text="ruleShortStatus(rule).label"></span>
                </span>
              </span>

              <span class="auto-rule-edit-status" x-show="editing[rule.id]" x-text="ruleEditStatus(rule)"></span>
              <button class="auto-btn-text is-ghost" type="button" x-show="canEditAutomations && expanded[rule.id] && !editing[rule.id]" x-on:click="testRule(rule)"
                      x-bind:title="$t('automations.rule.test_button')">
                <svg class="automation-icon"><use href="#ico-play"></use></svg>
                <span>{{t "automations.rule.test_button"}}</span>
              </button>
              <button class="auto-btn-text" type="button" x-show="canEditAutomations && expanded[rule.id] && !editing[rule.id]" x-bind:class="{ 'is-active': editing[rule.id] }"
                      x-on:click="startEditing(rule)" x-bind:aria-pressed="Boolean(editing[rule.id])"
                      x-bind:title="$t('automations.rule.edit_button.tooltip_edit')">
                <svg class="automation-icon"><use href="#ico-pencil"></use></svg>
                <span>{{t "automations.rule.edit_button.label"}}</span>
              </button>

              <label class="settings-toggle" x-show="canEditAutomations || canOperateAutomations" x-on:click.stop
                     x-bind:title="rule.enabled ? $t('automations.rule.enabled_toggle.title_on') : $t('automations.rule.enabled_toggle.title_off')">
                <input type="checkbox" x-bind:checked="rule.enabled" x-on:change="toggleEnabled(rule.id)"
                       x-bind:aria-label="$t('automations.rule.enabled_toggle.aria_label', {name: rule.name})">
                <span class="settings-toggle-track"><span class="settings-toggle-thumb"></span></span>
              </label>
              <svg class="automation-icon auto-rule-chevron" aria-hidden="true" x-show="!expanded[rule.id]"><use href="#ico-chevron"></use></svg>
            </div>

            <div class="auto-rule-spark" x-show="showHistory && !expanded[rule.id]" x-bind:class="'is-tone-' + liveTone(ruleSparkCondition(rule) || {})"
                 x-bind:style="{ animationDelay: (document.rules.indexOf(rule) * 40) + 'ms' }">
              <template x-if="ruleSparkFor(rule).empty">
                <span class="auto-rule-spark-empty">{{t "automations.rule.spark.empty"}}</span>
              </template>
              <template x-if="!ruleSparkFor(rule).empty">
                <svg class="auto-rule-spark-svg" viewBox="0 0 150 30" preserveAspectRatio="none" aria-hidden="true">
                  <line class="auto-rule-spark-target" x1="0" x2="150" x-bind:y1="ruleSparkFor(rule).band.y" x-bind:y2="ruleSparkFor(rule).band.y"></line>
                  <path class="auto-rule-spark-line" x-bind:d="ruleSparkFor(rule).path"></path>
                </svg>
              </template>
            </div>

            <div class="auto-rule-body" x-show="expanded[rule.id]">
              <fieldset class="auto-readonly-scope" x-bind:disabled="!canEditAutomations">

              <template x-if="liveBars(rule).length">
                <div class="auto-live-list">
                  <template x-for="bar in liveBars(rule)" x-bind:key="bar.index">
                    <div class="auto-live">
                      <span class="auto-figure-label" x-text="$t('automations.rule.live.caption', {field: bar.title})"></span>
                      <div class="auto-live-bar" x-bind:class="'is-tone-' + bar.tone" role="img" x-bind:aria-label="$t('automations.rule.live.aria_label')">
                        <i class="auto-live-fill" x-bind:style="{ width: (bar.fraction * 100) + '%' }"></i>
                        <i class="auto-live-band" x-show="bar.band" x-bind:style="bar.band ? { left: (bar.band.left * 100) + '%', width: (bar.band.width * 100) + '%' } : {}"></i>
                        <i class="auto-live-mark" x-bind:style="{ left: (bar.mark * 100) + '%' }"></i>
                        <span class="auto-live-label">
                          <span x-text="bar.valueText"></span>
                          <span x-show="bar.thresholdText" x-text="$t('automations.rule.live.threshold', {value: bar.thresholdText})"></span>
                        </span>
                      </div>
                    </div>
                  </template>
                </div>
              </template>

              <template x-if="!editing[rule.id]">
                <div class="auto-rule-view">

                  <div class="auto-blocks">
                    <section class="auto-block">
                      <h4 class="auto-block-cap">{{t "automations.rule.block.when"}}</h4>
                      <ul class="auto-lines">
                        {{template "automations-condition-lines"}}
                      </ul>
                    </section>

                    <section class="auto-block">
                      <h4 class="auto-block-cap">{{t "automations.rule.block.then"}}</h4>
                      <ul class="auto-lines">
                        {{template "automations-action-lines"}}
                      </ul>
                    </section>

                    <section class="auto-block">
                      <h4 class="auto-block-cap">{{t "automations.rule.block.flow"}}</h4>
                      <ul class="auto-lines">
                        <li class="auto-line">
                          <svg class="automation-icon"><use href="#ico-history"></use></svg>
                          <span class="auto-line-text" x-text="rule.repeat_seconds > 0 ? $t('automations.rule.flow.repeat', {seconds: rule.repeat_seconds}) : $t('automations.rule.flow.once')"></span>
                        </li>
                        <li class="auto-line">
                          <svg class="automation-icon"><use href="#ico-gate"></use></svg>
                          <span class="auto-line-text" x-text="$t('automations.rule.flow.cooldown', {seconds: rule.cooldown_seconds || 0})"></span>
                          <span class="field-help">
                            <button class="field-help-trigger" type="button" x-bind:aria-label="$t('automations.rule_editor.cooldown_help_aria_label')">
                              <svg><use href="#ico-help"></use></svg>
                            </button>
                            <span class="field-help-text" role="tooltip" x-text="fieldHelp('cooldown_seconds')"></span>
                          </span>
                        </li>
                      </ul>
                    </section>
                  </div>

                </div>
              </template>

              <template x-if="editing[rule.id]">
                <div class="auto-rule-edit">
                  <p class="message error" x-show="validateRuleBeforeSave(rule).length" x-text="validateRuleBeforeSave(rule).join(' / ')"></p>

                  <section class="auto-block">
                    <h4 class="auto-block-cap">{{t "automations.rule.block.when"}}</h4>
                    <div class="auto-edit-list">
                      {{template "automations-condition-editors"}}
                    </div>
                    {{template "automations-condition-tiles"}}
                  </section>

                  <section class="auto-block">
                    <h4 class="auto-block-cap">{{t "automations.rule.block.then"}}</h4>
                    <div class="auto-edit-list">
                      {{template "automations-action-editors"}}
                    </div>
                    {{template "automations-action-tiles"}}
                  </section>

                  <section class="auto-block auto-flow-group" data-tour="rule-flow">
                    <h4 class="auto-block-cap">{{t "automations.rule.block.flow"}}</h4>
                    <div class="auto-flow-row">
                      <svg class="automation-icon auto-flow-icon" aria-hidden="true"><use href="#ico-history"></use></svg>
                      <span class="auto-flow-label">{{t "automations.rule.flow.mode_label"}}</span>
                      <span class="field-help">
                        <button class="field-help-trigger" type="button" x-bind:aria-label="$t('automations.rule_editor.repeat_help_aria_label')">
                          <svg><use href="#ico-help"></use></svg>
                        </button>
                        <span class="field-help-text" role="tooltip" x-text="fieldHelp('repeat_seconds')"></span>
                      </span>
                      <div class="auto-segment" role="radiogroup" x-bind:aria-label="$t('automations.rule.flow.mode_label')">
                        <button class="auto-segment-tab" type="button" role="radio" x-on:click="setRepeatMode(rule, 'once')"
                                x-bind:aria-checked="rule.repeat_seconds > 0 ? 'false' : 'true'">{{t "automations.rule.flow.once_segment"}}</button>
                        <button class="auto-segment-tab" type="button" role="radio" x-on:click="setRepeatMode(rule, 'repeat')"
                                x-bind:disabled="hasToggleAction(rule)"
                                x-bind:aria-checked="rule.repeat_seconds > 0 ? 'true' : 'false'">{{t "automations.rule.flow.repeat_segment"}}</button>
                      </div>
                      <template x-if="rule.repeat_seconds > 0">
                        <span class="auto-flow-row">
                          <span>{{t "automations.rule.flow.every"}}</span>
                          <span class="auto-field" x-data="{ get stepTarget() { return rule }, stepKey: 'repeat_seconds', stepOpts: { min: 1, max: 86400, step: 10 }, stepUnit: $t('automations.condition.unit_seconds'), stepLabel: $t('automations.rule_editor.repeat_label') }">
                            {{template "auto-stepper"}}
                          </span>
                          <span class="field-help">
                            <button class="field-help-trigger" type="button" x-bind:aria-label="$t('automations.rule_editor.repeat_help_aria_label')">
                              <svg><use href="#ico-help"></use></svg>
                            </button>
                            <span class="field-help-text" role="tooltip" x-text="fieldHelp('repeat_seconds')"></span>
                          </span>
                        </span>
                      </template>
                    </div>
                    <p class="auto-hint" x-show="hasToggleAction(rule)">{{t "automations.rule_editor.repeat_blocked_toggle"}}</p>
                    <div class="auto-flow-row">
                      <svg class="automation-icon auto-flow-icon" aria-hidden="true"><use href="#ico-gate"></use></svg>
                      <span class="auto-flow-label">
                        {{t "automations.rule_editor.cooldown_label"}}
                        <span class="field-help">
                          <button class="field-help-trigger" type="button" x-bind:aria-label="$t('automations.rule_editor.cooldown_help_aria_label')">
                            <svg><use href="#ico-help"></use></svg>
                          </button>
                          <span class="field-help-text" role="tooltip" x-text="fieldHelp('cooldown_seconds')"></span>
                        </span>
                      </span>
                      <div class="auto-field" x-data="{ get stepTarget() { return rule }, stepKey: 'cooldown_seconds', stepOpts: { min: 0, step: 10, fallback: 0 }, stepUnit: $t('automations.condition.unit_seconds'), stepLabel: $t('automations.rule_editor.cooldown_label') }">
                        {{template "auto-stepper"}}
                      </div>
                    </div>
                    <div class="auto-flow-row auto-flow-toggle-row">
                      <svg class="automation-icon auto-flow-icon" aria-hidden="true"><use href="#ico-layers"></use></svg>
                      <span class="auto-flow-label">{{t "automations.scenario.edit.history.label"}}</span>
                      <span class="field-help">
                        <button class="field-help-trigger" type="button" x-bind:aria-label="$t('automations.history.explanation_button.aria_label')">
                          <svg><use href="#ico-help"></use></svg>
                        </button>
                        <span class="field-help-text" role="tooltip" x-text="fieldHelp('history_enabled')"></span>
                      </span>
                      <label class="settings-toggle auto-flow-toggle"
                             x-bind:title="rule.history_enabled ? $t('automations.history.enabled_title') : $t('automations.history.disabled_title')">
                        <input x-bind:id="`history-enabled-${rule.id}`" type="checkbox" role="switch"
                               x-model="rule.history_enabled" x-bind:aria-checked="rule.history_enabled"
                               x-bind:aria-label="$t('automations.history.enabled_aria_label', {name: rule.name})">
                        <span class="settings-toggle-track" aria-hidden="true"><span class="settings-toggle-thumb"></span></span>
                      </label>
                    </div>
                  </section>

                  <div class="auto-rule-foot">
                    <button class="auto-btn-text is-danger" type="button" x-show="canEditAutomations" x-on:click="removeRule(rule.id)">
                      <svg class="automation-icon"><use href="#ico-trash"></use></svg>
                      <span>{{t "automations.rule.footer.delete"}}</span>
                    </button>
                    <span class="auto-rule-foot-main">
                      <button class="auto-btn-text is-ghost" type="button" x-on:click="discardEditing(rule)">
                        <span>{{t "automations.rule.footer.discard"}}</span>
                      </button>
                      <button class="auto-btn-text is-primary" type="button" x-on:click="stopEditing(rule)">
                        <svg class="automation-icon"><use href="#ico-check"></use></svg>
                        <span>{{t "automations.rule.footer.done"}}</span>
                      </button>
                    </span>
                  </div>
                </div>
              </template>

              </fieldset>

              <template x-if="!editing[rule.id]">
                <div class="auto-rule-view auto-rule-after">
                  <template x-if="rule.history_enabled">
                    <div class="auto-fires" data-tour="rule-fires">
                      <div class="auto-fires-head" x-show="ruleTriggers(rule).marks.length">
                        <span class="auto-block-cap" x-text="ruleTriggers(rule).marks.length === 1 ? $t('automations.rule.timeline.caption_one') : $t('automations.rule.timeline.caption_many', {count: ruleTriggers(rule).marks.length})"></span>
                        <span class="auto-fires-right">
                          <small x-text="$t('automations.rule.timeline.since', {time: ruleTriggers(rule).sinceLabel})"></small>
                          <button type="button" class="auto-fires-toggle" data-tour="rule-history-toggle"
                                  x-bind:aria-expanded="historyExpanded[rule.id] ? 'true' : 'false'"
                                  x-bind:aria-controls="`history-fold-${rule.id}`"
                                  x-on:click="toggleHistory(rule, $el.closest('.auto-fires').querySelector('.auto-fires-box'))">
                            <span class="auto-fires-toggle-label">
                              <span class="is-show">{{t "automations.history.toggle_show"}}</span>
                              <span class="is-hide">{{t "automations.history.toggle_hide"}}</span>
                            </span>
                            <span class="auto-fires-count" aria-hidden="true" x-text="historyEntries(rule).length"></span>
                            <svg class="automation-icon auto-fires-chevron" aria-hidden="true"><use href="#ico-chevron"></use></svg>
                          </button>
                        </span>
                      </div>
                      <div class="auto-fires-box">
                        <div class="auto-fires-track" x-bind:class="{ empty: ruleTriggers(rule).empty }">
                          <template x-if="ruleTriggers(rule).empty">
                            <span x-text="$t('automations.rule.timeline.empty')"></span>
                          </template>
                          <template x-for="mark in ruleTriggers(rule).marks" x-bind:key="mark.at">
                            <button type="button" class="auto-fires-dot"
                                    x-bind:class="[mark.tone, historySelected[rule.id] === mark.at ? 'on' : '']"
                                    x-bind:data-at="mark.at"
                                    x-bind:style="{ left: (mark.x * 100) + '%' }"
                                    x-bind:title="mark.label"
                                    x-bind:aria-label="$t('automations.history.mark_aria_label', {result: mark.resultLabel, time: mark.label})"
                                    x-on:click="selectHistoryMark(rule, mark.at, $el.closest('.auto-fires-box'))"></button>
                          </template>
                          <template x-for="(mark, index) in ruleTriggers(rule).marks.filter((item) => item.showLabel)" x-bind:key="index">
                            <em x-bind:style="{ left: (mark.x * 100) + '%' }" x-text="mark.label"></em>
                          </template>
                        </div>
                        <div class="auto-fires-fold" x-bind:id="`history-fold-${rule.id}`" x-bind:data-open="historyExpanded[rule.id] ? 'true' : 'false'">
                          <div class="auto-fires-fold-inner" x-effect="$el.inert = !historyExpanded[rule.id]">
                            <template x-if="historyRendered[rule.id]">
                              <div class="auto-axis" x-init="watchHistoryAxis($el)">
                                <span class="auto-axis-line"></span>
                                <template x-for="day in historyDays(rule)" x-bind:key="day.start">
                                  <div>
                                    <p class="auto-axis-caption" x-bind:style="{ '--i': day.order }" x-text="day.label"></p>
                                    <ol class="auto-axis-rows">
                                      <template x-for="row in day.rows" x-bind:key="row.event.at">
                                        <li>
                                          <button type="button" class="auto-axis-row"
                                                  x-bind:class="{ on: historySelected[rule.id] === row.event.at }"
                                                  x-bind:data-at="row.event.at"
                                                  x-bind:style="{ '--i': row.order }"
                                                  x-on:click="toggleHistoryEntry(rule, row.event.at)">
                                            <span class="auto-axis-dot" x-bind:class="historyResultInfo(row.event.result).tone" x-bind:data-at="row.event.at"></span>
                                            <span class="auto-axis-time" x-text="historyTimestamp(row.event)"></span>
                                            <b class="auto-axis-result" x-text="historyResultInfo(row.event.result).label"></b>
                                            <span class="auto-axis-test" x-show="row.event.test">{{t "automations.history.test_badge"}}</span>
                                            <template x-for="(part, index) in historyEventParts(row.event)" x-bind:key="index">
                                              <span class="auto-axis-detail" x-bind:class="part.kind">
                                                <strong x-show="part.title" x-text="part.title"></strong><span x-text="(part.title && part.text ? ', ' : '') + part.text"></span>
                                              </span>
                                            </template>
                                          </button>
                                        </li>
                                      </template>
                                    </ol>
                                  </div>
                                </template>
                              </div>
                            </template>
                          </div>
                        </div>
                      </div>
                    </div>
                  </template>
                  <template x-if="!rule.history_enabled">
                    <p class="sub">{{t "automations.history.disabled_message"}}</p>
                  </template>
                  <div class="auto-mobile-actions">
                    <button class="auto-btn-text" type="button" x-show="canEditAutomations" x-on:click="startEditing(rule)">
                      <svg class="automation-icon"><use href="#ico-pencil"></use></svg>
                      <span>{{t "automations.rule.edit_button.label"}}</span>
                    </button>
                    <button class="auto-btn-text is-ghost" type="button" x-show="canEditAutomations" x-on:click="testRule(rule)">
                      <svg class="automation-icon"><use href="#ico-play"></use></svg>
                      <span>{{t "automations.rule.test_button"}}</span>
                    </button>
                    <button class="auto-btn-text is-ghost is-danger is-icon" type="button" x-show="canEditAutomations" x-on:click="removeRule(rule.id)"
                            x-bind:aria-label="$t('automations.rule.footer.delete')" x-bind:title="$t('automations.rule.footer.delete')">
                      <svg class="automation-icon"><use href="#ico-trash"></use></svg>
                    </button>
                  </div>
                </div>
              </template>
            </div>

{{end}}
