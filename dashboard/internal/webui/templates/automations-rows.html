{{define "automations-condition-rows"}}
                <template x-for="(condition, index) in rowsOwner.conditions" x-bind:key="index">
                  <div>
                    <div class="cond-conjunction" x-show="index > 0">{{t "automations.editor.condition_gate"}}</div>
                    <div class="cond" x-bind:class="conditionState(rowsOwner, index)">
                      <div class="cond-head">
                        <svg class="automation-icon"><use x-bind:href="'#' + describeCondition(condition).icon"></use></svg>
                        <span class="cond-title" x-text="describeCondition(condition).title"></span>
                        <span class="cond-summary" x-text="describeCondition(condition).summary"></span>
                        <span class="automation-value">
                          <span x-text="rowsReport(index) && rowsReport(index).value != null ? rowsReport(index).value : '—'"></span>
                          <span class="automation-unit" x-text="describeCondition(condition).unit"></span>
                        </span>
                      </div>
                      <div class="cond-meter">
                        <span class="cond-meter-fill" x-bind:style="meterStyle(rowsOwner, index)"></span>
                        <span class="cond-meter-mark" x-bind:style="markStyle(rowsOwner, index)"></span>
                      </div>
                      <div class="cond-state" x-text="conditionStateText(rowsOwner, index)"></div>
                    </div>
                  </div>
                </template>
{{end}}

{{define "automations-action-rows"}}
                <template x-for="(action, index) in rowsOwner.actions" x-bind:key="index">
                  <div class="act" x-bind:class="describeAction(action).kind">
                    <div class="act-head">
                      <svg class="automation-icon"><use x-bind:href="'#' + describeAction(action).icon"></use></svg>
                      <span class="act-title" x-text="describeAction(action).title"></span>
                    </div>
                    <div class="act-preview" x-bind:class="{ blocked: actionPreview(rowsOwner, index).blocked }"
                         x-text="actionPreview(rowsOwner, index).text"></div>
                    <template x-if="computeDrift(action, entities).drifted">
                      <div class="act-preview blocked"
                           x-text="$t('automations.action.mqtt_warning', {current_topic: computeDrift(action, entities).currentTopic})"></div>
                    </template>
                    <button class="icon-button labeled accent act-test" type="button"
                            x-show="hasAutomationsRole"
                            x-bind:disabled="!testState(rowsOwner, index).allowed"
                            x-bind:title="testState(rowsOwner, index).reason || $t('automations.action.test_button.tooltip_allowed')"
                            x-bind:aria-label="$t('automations.action.test_button.aria_label')"
                            x-on:click="testAction(rowsOwner, index)">
                      <svg class="automation-icon"><use href="#ico-play"></use></svg>
                      <span>{{t "automations.action.test_button.label"}}</span>
                    </button>
                  </div>
                </template>
{{end}}
